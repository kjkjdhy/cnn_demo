<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNN Convolution Demo</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 24px; background: #f5f6f8; color: #222; }
    h1 { margin-top: 0; font-size: 28px; text-align: center; margin-bottom: 20px; }
    .container { display: flex; flex-direction: column; gap: 14px; max-width: 1050px; margin: 0 auto; }
    .panel { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }

    /* ── Top panel ───────────────────────────────────────────────────────── */
    .imgs-row {
      display: flex; align-items: flex-start; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    .img-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .img-label-top {
      font-size: 12px; font-weight: 700; color: #374151;
      background: #eff6ff; border: 1.5px solid #bfdbfe;
      border-radius: 6px; padding: 2px 14px; min-width: 64px; text-align: center;
    }
    .main-canvas { border-radius: 8px; border: 2px solid #e5e7eb; display: block; }
    .img-label-bot { font-size: 11px; color: #9ca3af; }
    .img-arrow { font-size: 22px; color: #d1d5db; margin-top: 36px; }

    /* ── Bottom panel ────────────────────────────────────────────────────── */
    .bottom-panel { display: flex; gap: 18px; align-items: flex-start; }
    .col { min-width: 0; }
    .col-presets  { width: 180px; flex-shrink: 0; }
    .col-controls { width: 195px; flex-shrink: 0; border-left: 1px solid #f3f4f6; padding-left: 18px; }
    .col-right    { flex: 1; border-left: 1px solid #f3f4f6; padding-left: 18px; }

    .col-title { font-size: 13px; font-weight: 700; color: #111; margin-bottom: 8px; }

    /* Upload row */
    .upload-row { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
    .upload-btn {
      display: inline-block; padding: 4px 10px;
      background: #f3f4f6; border: 1.5px solid #d1d5db;
      border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; color: #374151; white-space: nowrap;
    }
    .upload-btn:hover { background: #e5e7eb; }
    .file-name { font-size: 11px; color: #9ca3af; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Preset text buttons */
    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .preset-btn {
      padding: 5px 4px; background: #f3f4f6; border: 1.5px solid #d1d5db;
      border-radius: 6px; font-size: 12px; font-weight: 600; color: #374151;
      cursor: pointer; text-align: center; white-space: nowrap;
    }
    .preset-btn:hover { background: #dbeafe; border-color: #93c5fd; }
    .preset-btn.active { background: #dbeafe; border-color: #1d4ed8; color: #1d4ed8; }

    /* Controls table */
    .ctrl-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    .ctrl-table td { padding: 5px 2px; font-size: 12px; vertical-align: middle; }
    .ctrl-table td:first-child { color: #6b7280; font-weight: 600; padding-right: 8px; white-space: nowrap; }
    .ctrl-val { font-size: 12px; font-weight: 700; color: #374151; }
    .ctrl-sel {
      font-size: 12px; padding: 3px 5px; border: 1.5px solid #d1d5db;
      border-radius: 5px; width: 100%; background: white; color: #222;
    }
    .ctrl-sel:focus { outline: none; border-color: #93c5fd; }
    .play-btn {
      width: 100%; padding: 8px 0; border-radius: 8px;
      background: #1d4ed8; color: white; font-weight: 700;
      font-size: 14px; border: none; cursor: pointer; margin-top: 2px;
    }
    .play-btn:hover { background: #1e40af; }

    /* Right column */
    .layer-info-text { font-size: 11px; color: #6b7280; margin-bottom: 8px; }
    .kernel-name-badge {
      display: inline-block; font-size: 12px; font-weight: 700; color: #1d4ed8;
      background: #eff6ff; border: 1.5px solid #bfdbfe;
      border-radius: 6px; padding: 2px 10px; margin-bottom: 8px;
    }
    .kernel-grid3x3 { display: grid; grid-template-columns: repeat(3, 44px); gap: 3px; margin-bottom: 9px; }
    .kc {
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      font-family: Consolas, monospace; font-size: 11px; font-weight: 700;
      border-radius: 5px; border: 1px solid rgba(0,0,0,0.06);
    }
    .kcp { background: #dbeafe; color: #1e40af; }
    .kcn { background: #fee2e2; color: #991b1b; }
    .kcz { background: #f3f4f6; color: #9ca3af; }
    .refresh-btn {
      padding: 5px 14px; background: #f3f4f6; border: 1.5px solid #d1d5db;
      border-radius: 7px; font-size: 12px; font-weight: 700; color: #374151;
      cursor: pointer; margin-bottom: 14px;
    }
    .refresh-btn:hover { background: #e5e7eb; }

    /* Prediction */
    .col-divider { border: none; border-top: 1px solid #e5e7eb; margin: 12px 0; }
    .class-waiting { color: #9ca3af; font-size: 12px; }
    .class-row { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
    .class-lbl {
      font-size: 12px; font-weight: 600; width: 120px; flex-shrink: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #222;
    }
    .class-bar-bg { flex: 1; background: #f3f4f6; border-radius: 4px; height: 13px; overflow: hidden; }
    .class-bar { height: 13px; border-radius: 4px; }
    .class-pct { font-size: 12px; font-weight: 700; min-width: 36px; text-align: right; color: #374151; }
    .model-note { font-size: 11px; color: #9ca3af; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>CNN Convolution Demo</h1>

  <div class="container">

    <!-- ── Top panel: three image canvases ────────────────────────────────── -->
    <div class="panel">
      <div class="imgs-row">
        <div class="img-wrap">
          <div class="img-label-top">Input</div>
          <canvas id="inputCanvas" class="main-canvas" width="220" height="220"></canvas>
        </div>
        <div class="img-arrow">→</div>
        <div class="img-wrap">
          <div class="img-label-top">Layer 1</div>
          <canvas id="layer1Canvas" class="main-canvas" width="220" height="220"></canvas>
          <div class="img-label-bot" id="l1InfoBot">← 1 dp →</div>
        </div>
        <div class="img-arrow">→</div>
        <div class="img-wrap">
          <div class="img-label-top">Layer 2</div>
          <canvas id="layer2Canvas" class="main-canvas" width="220" height="220"></canvas>
          <div class="img-label-bot" id="l2InfoBot">← 1 dp →</div>
        </div>
      </div>
    </div>

    <!-- ── Bottom panel: three columns ────────────────────────────────────── -->
    <div class="panel bottom-panel">

      <!-- Col 1: Upload + Example images -->
      <div class="col col-presets">
        <div class="col-title">Uploaded Image</div>
        <div class="upload-row">
          <label class="upload-btn">Browse…<input type="file" id="fileInput" accept="image/*" style="display:none"></label>
          <span class="file-name" id="fileName">No file…</span>
        </div>
        <div class="col-title" style="margin-top:12px">Example Images</div>
        <div class="preset-grid" id="presetGrid"></div>
      </div>

      <!-- Col 2: Edit Layer controls -->
      <div class="col col-controls">
        <div class="col-title">Edit Layer</div>
        <table class="ctrl-table">
          <tr>
            <td>Channels (this layer)</td>
            <td><div class="ctrl-val" id="ctrlChannels">—</div></td>
          </tr>
          <tr>
            <td>Layers</td>
            <td><select id="layerSel" class="ctrl-sel" onchange="onLayerChange()"></select></td>
          </tr>
          <tr>
            <td>Kernel Size (global)</td>
            <td><div class="ctrl-val">3 × 3</div></td>
          </tr>
          <tr>
            <td>Filter</td>
            <td><select id="filterSel" class="ctrl-sel" onchange="onFilterChange()"></select></td>
          </tr>
          <tr>
            <td>Speed</td>
            <td><input type="range" id="animSpeed" min="1" max="30" value="6" style="width:100%"></td>
          </tr>
        </table>
        <button class="play-btn" id="playBtn" onclick="animToggle()">▶ Play</button>
      </div>

      <!-- Col 3: Kernel display + Prediction -->
      <div class="col col-right">
        <div class="layer-info-text" id="layerInfoText">—</div>
        <div class="kernel-name-badge" id="kernelNameBadge">Filter #1</div>
        <div id="kernelGrid3x3" class="kernel-grid3x3"></div>
        <button class="refresh-btn" onclick="refreshAnim()">↺ Refresh</button>

        <hr class="col-divider">

        <div class="col-title">Prediction (MobileNet)</div>
        <div id="classResult"><div class="class-waiting">Select an image and press ▶ Play</div></div>
        <div class="model-note" id="modelStatus">Loading MobileNet…</div>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
  <script>
    const ANIM_SIZE = 64;
    const DISP      = 220;
    const MAX_IMG   = 320;

    const PRESETS = [
      { label: 'Dog',    url: 'https://images.unsplash.com/photo-1552053831-71594a27632d?w=320&h=320&fit=crop' },
      { label: 'Cat',    url: 'https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=320&h=320&fit=crop' },
      { label: 'Bird',   url: 'https://images.unsplash.com/photo-1522926193341-e9ffd686c60f?w=320&h=320&fit=crop' },
      { label: 'Car',    url: 'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=320&h=320&fit=crop' },
      { label: 'Plane',  url: 'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=320&h=320&fit=crop' },
      { label: 'Flower', url: 'https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=320&h=320&fit=crop' },
    ];

    let animState  = 'idle';
    let animRAF    = null;
    let animPos    = 0;
    let animSmall  = null;
    let animFull   = null;
    let animKernel = [[0,0,0],[0,1,0],[0,0,0]];
    let animOutW   = 0, animOutH = 0;
    let animOutPx  = null;

    let mobileNetModel = null;   // mobilenet 包，用于 classify()
    let kernelModel    = null;   // Keras LayersModel，用于提取 kernel weights
    let allLayerData   = [];
    let selLayer = 0, selFilter = 0;

    function clamp(x) { return Math.max(0, Math.min(255, Math.round(x))); }

    function scaleImageTo(src, tw, th) {
      const s = document.createElement('canvas');
      s.width = src.width; s.height = src.height;
      s.getContext('2d').putImageData(src, 0, 0);
      const d = document.createElement('canvas');
      d.width = tw; d.height = th;
      d.getContext('2d').drawImage(s, 0, 0, tw, th);
      return d.getContext('2d').getImageData(0, 0, tw, th);
    }

    // ── Presets ───────────────────────────────────────────────────────────
    function buildPresets() {
      const grid = document.getElementById('presetGrid');
      PRESETS.forEach((p, i) => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = p.label;
        btn.onclick = () => loadPreset(i);
        grid.appendChild(btn);
      });
    }

    function loadPreset(idx) {
      document.querySelectorAll('.preset-btn').forEach((el, i) =>
        el.classList.toggle('active', i === idx));
      stopAnim();
      document.getElementById('fileName').textContent = PRESETS[idx].label;
      document.getElementById('classResult').innerHTML =
        '<div class="class-waiting">Press ▶ Play to animate & classify</div>';

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const sc = Math.min(MAX_IMG / img.width, MAX_IMG / img.height, 1);
        const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        animFull = c.getContext('2d').getImageData(0, 0, w, h);
        paintInput(animFull, false);
        clearCanvas('layer1Canvas');
        clearCanvas('layer2Canvas');
      };
      img.onerror = () => alert('Image failed to load. Check network.');
      img.src = PRESETS[idx].url;
    }

    // ── File upload ────────────────────────────────────────────────────────
    document.getElementById('fileInput').addEventListener('change', function () {
      if (!this.files.length) return;
      const file = this.files[0];
      document.getElementById('fileName').textContent = file.name;
      document.querySelectorAll('.preset-btn').forEach(el => el.classList.remove('active'));
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const sc = Math.min(MAX_IMG / img.width, MAX_IMG / img.height, 1);
          const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          animFull = c.getContext('2d').getImageData(0, 0, w, h);
          paintInput(animFull, false);
          clearCanvas('layer1Canvas');
          clearCanvas('layer2Canvas');
          stopAnim();
          document.getElementById('classResult').innerHTML =
            '<div class="class-waiting">Press ▶ Play to animate & classify</div>';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ── Canvas helpers ─────────────────────────────────────────────────────
    function paintInput(imageData, pixelated) {
      const ctx = document.getElementById('inputCanvas').getContext('2d');
      const tmp = document.createElement('canvas');
      tmp.width = imageData.width; tmp.height = imageData.height;
      tmp.getContext('2d').putImageData(imageData, 0, 0);
      ctx.imageSmoothingEnabled = !pixelated;
      ctx.clearRect(0, 0, DISP, DISP);
      ctx.drawImage(tmp, 0, 0, DISP, DISP);
    }

    function paintWithKernel(ox, oy) {
      paintInput(animSmall, true);
      const ctx = document.getElementById('inputCanvas').getContext('2d');
      const sc = DISP / ANIM_SIZE, p = 1, ks = animKernel.length;
      const rx = (ox - p) * sc, ry = (oy - p) * sc, rw = ks * sc;
      ctx.fillStyle = 'rgba(255,60,60,0.18)'; ctx.fillRect(rx, ry, rw, rw);
      ctx.strokeStyle = '#ff3c3c'; ctx.lineWidth = 2;
      ctx.strokeRect(rx + 1, ry + 1, rw - 2, rw - 2);
      ctx.fillStyle = 'rgba(255,60,60,0.55)';
      ctx.fillRect(ox * sc, oy * sc, sc, sc);
    }

    function clearCanvas(id) {
      const ctx = document.getElementById(id).getContext('2d');
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, DISP, DISP);
    }

    function paintPixelsToCanvas(id, px, w, h) {
      const tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      tmp.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(px), w, h), 0, 0);
      const ctx = document.getElementById(id).getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(tmp, 0, 0, DISP, DISP);
    }

    // ── Animation ──────────────────────────────────────────────────────────
    function stopAnim() {
      if (animState === 'running') cancelAnimationFrame(animRAF);
      animState = 'idle'; animPos = 0;
      document.getElementById('playBtn').textContent = '▶ Play';
    }

    function setupAnim() {
      if (!animFull) return false;
      animSmall = scaleImageTo(animFull, ANIM_SIZE, ANIM_SIZE);
      const pad = 1, ks = 3;
      animOutW  = Math.floor((ANIM_SIZE + 2 * pad - ks) + 1);
      animOutH  = animOutW;
      animOutPx = new Uint8ClampedArray(animOutW * animOutH * 4);
      for (let i = 3; i < animOutPx.length; i += 4) animOutPx[i] = 255;
      animPos = 0;
      paintInput(animSmall, true);
      clearCanvas('layer1Canvas');
      clearCanvas('layer2Canvas');
      return true;
    }

    function animToggle() {
      if (animState === 'running') {
        cancelAnimationFrame(animRAF);
        animState = 'paused';
        document.getElementById('playBtn').textContent = '▶ Resume';
        return;
      }
      if (!animFull) { alert('Please select an image first'); return; }
      if (animState === 'idle' || animState === 'done') {
        if (!setupAnim()) return;
        document.getElementById('classResult').innerHTML =
          '<div class="class-waiting">Animating…</div>';
      }
      animState = 'running';
      document.getElementById('playBtn').textContent = '⏸ Pause';
      animRAF = requestAnimationFrame(animFrame);
    }

    function animFrame() {
      if (animState !== 'running') return;
      const speed = Number(document.getElementById('animSpeed').value);
      const total = animOutW * animOutH, pad = 1, ks = animKernel.length;

      for (let step = 0; step < speed && animPos < total; step++, animPos++) {
        const ox = animPos % animOutW, oy = Math.floor(animPos / animOutW);
        let sum = 0;
        for (let ky = 0; ky < ks; ky++) for (let kx = 0; kx < ks; kx++) {
          const ix = ox + kx - pad, iy = oy + ky - pad;
          if (ix >= 0 && ix < ANIM_SIZE && iy >= 0 && iy < ANIM_SIZE) {
            const di = (iy * ANIM_SIZE + ix) * 4;
            const g  = (animSmall.data[di] + animSmall.data[di+1] + animSmall.data[di+2]) / 3;
            sum += g * animKernel[ky][kx];
          }
        }
        const v = clamp(Math.abs(sum) * 2.5);
        const b = (oy * animOutW + ox) * 4;
        animOutPx[b] = animOutPx[b+1] = animOutPx[b+2] = v;
      }

      const cx = animPos % animOutW, cy = Math.floor(animPos / animOutW);
      if (animPos < total) paintWithKernel(cx, cy); else paintInput(animSmall, true);
      paintPixelsToCanvas('layer1Canvas', animOutPx, animOutW, animOutH);

      if (animPos >= total) {
        animState = 'done';
        document.getElementById('playBtn').textContent = '↺ Replay';
        computeLayer2();
        runClassification();
        return;
      }
      animRAF = requestAnimationFrame(animFrame);
    }

    function computeLayer2() {
      if (allLayerData.length < 2) return;
      const nextLayer = Math.min(selLayer + 1, allLayerData.length - 1);
      const k2 = allLayerData[nextLayer].filters[0];
      const pad = 1, ks = 3;
      const l2Px = new Uint8ClampedArray(animOutW * animOutH * 4);
      for (let i = 3; i < l2Px.length; i += 4) l2Px[i] = 255;
      for (let oy = 0; oy < animOutH; oy++) for (let ox = 0; ox < animOutW; ox++) {
        let sum = 0;
        for (let ky = 0; ky < ks; ky++) for (let kx = 0; kx < ks; kx++) {
          const ix = ox + kx - pad, iy = oy + ky - pad;
          if (ix >= 0 && ix < animOutW && iy >= 0 && iy < animOutH) {
            sum += animOutPx[(iy * animOutW + ix) * 4] * k2[ky][kx];
          }
        }
        const v = clamp(Math.abs(sum) * 2.5);
        const b = (oy * animOutW + ox) * 4;
        l2Px[b] = l2Px[b+1] = l2Px[b+2] = v;
      }
      paintPixelsToCanvas('layer2Canvas', l2Px, animOutW, animOutH);
      const ld2 = allLayerData[nextLayer];
      document.getElementById('l2InfoBot').textContent = `← ${ld2.nFilters} ch →`;
    }

    function refreshAnim() {
      stopAnim();
      if (animFull) {
        paintInput(animFull, false);
        clearCanvas('layer1Canvas');
        clearCanvas('layer2Canvas');
      }
    }

    // ── Classification ─────────────────────────────────────────────────────
    async function runClassification() {
      const el = document.getElementById('classResult');
      el.innerHTML = '<div class="class-waiting">Classifying…</div>';
      try {
        const tmp = document.createElement('canvas');
        tmp.width = animFull.width; tmp.height = animFull.height;
        tmp.getContext('2d').putImageData(animFull, 0, 0);
        const preds = await mobileNetModel.classify(tmp, 5);
        const top = preds[0].probability;
        el.innerHTML = preds.map((p, rank) => {
          const pct = (p.probability * 100).toFixed(1);
          const w   = Math.round((p.probability / top) * 100);
          const lbl = p.className.split(',')[0].trim();
          const col = rank === 0 ? '#1d4ed8' : '#93c5fd';
          return `<div class="class-row">
            <div class="class-lbl" title="${p.className}">${lbl}</div>
            <div class="class-bar-bg"><div class="class-bar" style="width:${w}%;background:${col}"></div></div>
            <div class="class-pct">${pct}%</div></div>`;
        }).join('');
        document.getElementById('modelStatus').textContent = '';
      } catch (e) {
        el.innerHTML = `<div class="class-waiting">Failed: ${e.message}</div>`;
      }
    }

    // ── Kernel grid display ────────────────────────────────────────────────
    function renderKernelGrid() {
      const grid = document.getElementById('kernelGrid3x3');
      grid.innerHTML = '';
      let maxAbs = 0;
      animKernel.forEach(r => r.forEach(v => { if (Math.abs(v) > maxAbs) maxAbs = Math.abs(v); }));
      animKernel.forEach(r => r.forEach(v => {
        const cell = document.createElement('div');
        const n = maxAbs > 0 ? v / maxAbs : 0;
        cell.className = 'kc ' + (n > 0.08 ? 'kcp' : n < -0.08 ? 'kcn' : 'kcz');
        const abs = Math.abs(v);
        cell.textContent = abs < 0.005 ? '0'
          : (v < 0 ? '−' : '+') + abs.toFixed(2);
        grid.appendChild(cell);
      }));
    }

    function updateLayerInfo() {
      const ld = allLayerData[selLayer];
      if (!ld) return;
      document.getElementById('layerInfoText').textContent =
        `Layer ${selLayer + 1} · 1 ch · 3×3 · stride=1 · p=1 · no pool`;
      document.getElementById('kernelNameBadge').textContent = `Filter #${selFilter + 1}`;
      document.getElementById('ctrlChannels').textContent = ld.nFilters;
      document.getElementById('l1InfoBot').textContent = `← ${ld.nFilters} ch →`;
      renderKernelGrid();
    }

    // ── Layer / Filter selectors ───────────────────────────────────────────
    function populateLayerSel() {
      const sel = document.getElementById('layerSel');
      sel.innerHTML = '';
      allLayerData.forEach((ld, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `Layer ${i + 1} (${ld.typeLabel})`;
        sel.appendChild(opt);
      });
      populateFilterSel();
    }

    function populateFilterSel() {
      const ld = allLayerData[selLayer];
      if (!ld) return;
      const sel = document.getElementById('filterSel');
      sel.innerHTML = '';
      const n = Math.min(ld.filters.length, 32);
      for (let i = 0; i < n; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `Filter #${i + 1}`;
        sel.appendChild(opt);
      }
      sel.value = selFilter < n ? selFilter : 0;
    }

    function onLayerChange() {
      selLayer  = parseInt(document.getElementById('layerSel').value);
      selFilter = 0;
      populateFilterSel();
      animKernel = allLayerData[selLayer].filters[0];
      updateLayerInfo();
      if (animState !== 'running') animState = 'idle';
    }

    function onFilterChange() {
      selFilter  = parseInt(document.getElementById('filterSel').value);
      animKernel = allLayerData[selLayer].filters[selFilter];
      updateLayerInfo();
      if (animState !== 'running') animState = 'idle';
    }

    // ── MobileNet kernel extraction ────────────────────────────────────────
    async function processKernelTensor(tensor) {
      if (allLayerData.length >= 4) return;
      const shape = tensor.shape;
      if (!shape || shape.length !== 4 || shape[0] !== 3 || shape[1] !== 3) return;
      const inC = shape[2], outC = shape[3];
      const arr = await tensor.array();
      const filters = [];
      if (outC === 1) {
        for (let c = 0; c < Math.min(inC, 32); c++)
          filters.push(arr.map(row => row.map(cell => cell[c][0])));
      } else {
        for (let f = 0; f < Math.min(outC, 32); f++)
          filters.push(arr.map(row => row.map(cell => {
            let s = 0; for (let c = 0; c < inC; c++) s += cell[c][f]; return s / inC;
          })));
      }
      allLayerData.push({
        typeLabel: outC === 1 ? 'DW' : 'Conv',
        nFilters:  outC === 1 ? inC : outC,
        filters
      });
    }

    async function extractAllFilters() {
      allLayerData = [];
      // kernelModel 是 Keras LayersModel，conv kernels 通过 .layers 可以直接访问
      for (const layer of kernelModel.layers) {
        if (allLayerData.length >= 4) break;
        const w = layer.getWeights();
        if (w.length) await processKernelTensor(w[0]);
      }
      if (allLayerData.length > 0) {
        animKernel = allLayerData[0].filters[0];
        populateLayerSel();
        updateLayerInfo();
      }
    }

    // ── Init ──────────────────────────────────────────────────────────────
    buildPresets();

    (async () => {
      try {
        // 1. 加载 mobilenet 包（TFHub GraphModel）——只用于 classify()
        mobileNetModel = await mobilenet.load({ version: 1, alpha: 1.0 });

        // 2. 加载 Keras 格式旧版模型——只用于 kernel 权重展示
        //    TFHub GraphModel 的 conv kernel 被 frozen 进图里，无法从外部访问；
        //    Keras LayersModel 的每一层权重都可通过 layer.getWeights() 直接读取。
        kernelModel = await tf.loadLayersModel(
          'https://storage.googleapis.com/tfjs-models/tfjs/mobilenet_v1_1.0_224/model.json'
        );
        await extractAllFilters();

        const st = document.getElementById('modelStatus');
        if (st) { st.textContent = 'MobileNet ready ✓'; setTimeout(() => { if (st) st.textContent = ''; }, 3000); }
      } catch (e) {
        console.error('[load error]', e);
        document.getElementById('modelStatus').textContent = `Load failed: ${e.message || e}`;
      }
    })();
  </script>
</body>
</html>
