<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNN Convolution Demo</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }

    body { margin: 0; padding: 24px; background: #f5f6f8; color: #222; }
    h1 { margin-top: 0; font-size: 28px; text-align: center; }
    .subtitle { color: #555; margin-bottom: 24px; line-height: 1.5; text-align: center; }

    .container { display: flex; flex-direction: column; gap: 16px; }
    .panel { background: white; border-radius: 14px; padding: 14px 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
    .bottom-row { display: flex; gap: 16px; align-items: flex-start; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-start; flex: 1 1 0; min-width: 0; }
    .info-panel { flex: 0 0 280px; }

    .control-group { margin-bottom: 0; flex: 1 1 110px; max-width: 190px; }
    label { display: block; font-weight: 700; margin-bottom: 4px; font-size: 12px; }
    select, input[type="file"], button { width: 100%; }
    select, button { padding: 6px 8px; border-radius: 8px; border: 1px solid #ccc; background: white; font-size: 12px; }
    button { cursor: pointer; background: #222; color: white; border: none; font-weight: 700; }
    button:hover { opacity: 0.9; }
    .preset-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .preset-buttons button { background: #3b4252; font-size: 12px; }

    .toggle-row { display: flex; gap: 16px; }
    .toggle-item { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .toggle-item input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; }

    .slider-row { display: flex; align-items: center; gap: 8px; }
    .slider-row input[type="range"] { flex: 1; }
    .slider-val { font-size: 12px; color: #444; min-width: 32px; text-align: right; }

    /* Grid */
    #layerGrid { display: flex; gap: 16px; align-items: flex-start; overflow-x: auto; padding-bottom: 6px; }
    .layer-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .col-row-label { font-size: 11px; font-weight: 700; color: #555; text-align: center; }
    .col-label {
      font-size: 11px; font-weight: 700; padding: 3px 10px;
      border-radius: 6px; white-space: nowrap;
    }
    .ch-h_edge       { background: #dbeafe; color: #1d4ed8; }
    .ch-v_edge       { background: #dcfce7; color: #15803d; }
    .ch-grad_mag     { background: #f3e8ff; color: #7e22ce; }
    .ch-color_contrast { background: #fee2e2; color: #991b1b; }
    .ch-input        { background: #f3f4f6; color: #374151; }

    .canvas-cell { flex: none; }
    .canvas-cell canvas {
      display: block; background: #111; width: 280px;
      border-radius: 8px; border: 2px solid #e5e7eb;
      image-rendering: pixelated;
    }
    .canvas-cell.ch-h_edge        canvas { border-color: #93c5fd; }
    .canvas-cell.ch-v_edge        canvas { border-color: #86efac; }
    .canvas-cell.ch-grad_mag      canvas { border-color: #d8b4fe; }
    .canvas-cell.ch-color_contrast canvas { border-color: #fca5a5; }

    .formula {
      background: #101418; color: #e8edf2;
      padding: 12px 14px; border-radius: 10px; font-family: Consolas, monospace;
      line-height: 1.8; font-size: 11px; word-break: break-word;
    }

    @media (max-width: 600px) {
      .controls { gap: 8px 12px; }
      .control-group { min-width: 100px; }
    }
  </style>
</head>
<body>
  <h1>CNN Convolution Demo</h1>
  <p class="subtitle">
    Each layer runs Conv → Threshold → MaxPool. Feature maps are overlaid on the original image — use α to blend.
  </p>

  <div class="container">
    <div class="panel">
      <div id="layerGrid"></div>
    </div>

    <div class="bottom-row">
    <div class="panel controls">

      <div class="control-group">
        <label for="imageUpload">Upload Image</label>
        <input id="imageUpload" type="file" accept="image/*" />
      </div>

      <div class="control-group">
        <label>Example Images</label>
        <div class="preset-buttons">
          <button onclick="loadPreset('portrait')">Portrait</button>
          <button onclick="loadPreset('building')">Building</button>
          <button onclick="loadPreset('street')">Street</button>
          <button onclick="loadPreset('nature')">Nature</button>
        </div>
      </div>

      <div class="control-group">
        <label for="filterType">Filter</label>
        <select id="filterType">
          <option value="h_edge">Horizontal Edge</option>
          <option value="v_edge">Vertical Edge</option>
          <option value="grad_mag">Gradient Magnitude</option>
          <option value="color_contrast">Color Contrast</option>
        </select>
      </div>

      <div class="control-group">
        <label for="numLayers">Layers</label>
        <select id="numLayers">
          <option value="1">1 Layer</option>
          <option value="2" selected>2 Layers</option>
          <option value="3">3 Layers</option>
          <option value="4">4 Layers</option>
        </select>
      </div>

      <div class="control-group">
        <label for="kernelSize">Kernel Size</label>
        <select id="kernelSize">
          <option value="3" selected>3 × 3</option>
          <option value="5">5 × 5</option>
          <option value="7">7 × 7</option>
        </select>
      </div>

      <div class="control-group">
        <label for="stride">Stride</label>
        <select id="stride">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="4">4</option>
        </select>
      </div>

      <div class="control-group">
        <label for="paddingMode">Padding</label>
        <select id="paddingMode">
          <option value="same" selected>auto: p = 1</option>
          <option value="valid">valid: p = 0</option>
          <option value="custom1">custom: p = 1</option>
          <option value="custom2">custom: p = 2</option>
          <option value="custom3">custom: p = 3</option>
          <option value="custom5">custom: p = 5</option>
        </select>
      </div>

      <div class="control-group">
        <label>Pooling</label>
        <select id="poolMode">
          <option value="none">None</option>
          <option value="max2" selected>MaxPool 2×2</option>
          <option value="max3">MaxPool 3×3</option>
          <option value="max4">MaxPool 4×4</option>
          <option value="avg2">AvgPool 2×2</option>
          <option value="avg3">AvgPool 3×3</option>
          <option value="avg4">AvgPool 4×4</option>
        </select>
      </div>

      <div class="control-group">
        <label>α — <span id="alphaVal">0.70</span></label>
        <div class="slider-row">
          <input type="range" id="alpha" min="0" max="1" step="0.01" value="0.7" />
        </div>
      </div>

      <div class="control-group">
        <label>Threshold — <span id="thresholdVal">15</span></label>
        <div class="slider-row">
          <input type="range" id="threshold" min="0" max="120" step="1" value="15" />
        </div>
      </div>

      <div class="control-group">
        <label>Contrast — <span id="contrastScaleVal">3.0</span></label>
        <div class="slider-row">
          <input type="range" id="contrastScale" min="1" max="10" step="0.5" value="3" />
        </div>
      </div>

    </div>

    <div class="panel info-panel">
      <div class="formula" id="formulaBox"></div>
    </div>
    </div><!-- .bottom-row -->
  </div>

  <script>
    const MAX_SIZE = 320;
    const CHANNELS = ['h_edge', 'v_edge', 'grad_mag', 'color_contrast'];
    const CHANNEL_LABELS = {
      h_edge: 'H-Edge', v_edge: 'V-Edge',
      grad_mag: 'Grad Mag', color_contrast: 'Color Contrast'
    };

    let originalImageData = null;

    // ── Utilities ─────────────────────────────────────────────────────────────

    function clamp(x) { return Math.max(0, Math.min(255, x)); }

    function getPixel(data, W, H, x, y, c) {
      if (x < 0 || x >= W || y < 0 || y >= H) return 0;
      return data[(y * W + x) * 4 + c];
    }

    function avgChannels(maps) {
      const w = maps[0].width, h = maps[0].height;
      const result = new ImageData(w, h);
      for (let i = 0; i < result.data.length; i += 4) {
        for (let c = 0; c < 3; c++) {
          let sum = 0;
          for (const m of maps) sum += m.data[i + c];
          result.data[i + c] = clamp(sum / maps.length);
        }
        result.data[i + 3] = 255;
      }
      return result;
    }

    // Scale imageData to targetW × targetH using a canvas intermediate.
    function scaleImageTo(imageData, targetW, targetH) {
      if (imageData.width === targetW && imageData.height === targetH) return imageData;
      const src = document.createElement('canvas');
      src.width = imageData.width; src.height = imageData.height;
      src.getContext('2d').putImageData(imageData, 0, 0);
      const dst = document.createElement('canvas');
      dst.width = targetW; dst.height = targetH;
      dst.getContext('2d').drawImage(src, 0, 0, targetW, targetH);
      return dst.getContext('2d').getImageData(0, 0, targetW, targetH);
    }

    // ── Kernel building ───────────────────────────────────────────────────────

    function getPadding(mode, k) {
      if (mode === 'valid') return 0;
      if (mode.startsWith('custom')) return Number(mode.replace('custom', ''));
      if (mode === 'same') return Math.floor((k - 1) / 2);
      return 0;
    }

    function binomialRow(n) {
      const row = [1];
      for (let i = 1; i < n; i++) row[i] = row[i - 1] * (n - i) / i;
      return row;
    }

    function buildKernel(type, size) {
      const kernel = Array.from({ length: size }, () => Array(size).fill(0));
      const center = Math.floor(size / 2);
      if (type === 'h_edge' || type === 'v_edge') {
        const binom = binomialRow(size);
        const deriv = Array.from({ length: size }, (_, i) => i - center);
        for (let y = 0; y < size; y++)
          for (let x = 0; x < size; x++)
            kernel[y][x] = type === 'h_edge' ? deriv[y] * binom[x] : deriv[x] * binom[y];
      }
      return kernel;
    }

    // ── Feature computations ──────────────────────────────────────────────────

    // Standard directional Sobel — abs, grayscale output kept per-channel.
    function convolveAbs(imageData, kernel, stride, padding) {
      const W = imageData.width, H = imageData.height;
      const k = kernel.length;
      const outW = Math.max(1, Math.floor((W + 2 * padding - k) / stride + 1));
      const outH = Math.max(1, Math.floor((H + 2 * padding - k) / stride + 1));
      const output = new Uint8ClampedArray(outW * outH * 4);
      for (let oy = 0; oy < outH; oy++)
        for (let ox = 0; ox < outW; ox++) {
          const base = (oy * outW + ox) * 4;
          for (let c = 0; c < 3; c++) {
            let sum = 0;
            for (let ky = 0; ky < k; ky++)
              for (let kx = 0; kx < k; kx++)
                sum += getPixel(imageData.data, W, H, ox * stride + kx - padding, oy * stride + ky - padding, c) * kernel[ky][kx];
            output[base + c] = clamp(Math.abs(sum));
          }
          output[base + 3] = 255;
        }
      return new ImageData(output, outW, outH);
    }

    // Gradient magnitude = sqrt(Gx²+Gy²) averaged over channels, normalized, grayscale.
    function computeGradientMagnitude(imageData, k, stride, padding) {
      const W = imageData.width, H = imageData.height;
      const kX = buildKernel('v_edge', k);
      const kY = buildKernel('h_edge', k);
      const outW = Math.max(1, Math.floor((W + 2 * padding - k) / stride + 1));
      const outH = Math.max(1, Math.floor((H + 2 * padding - k) / stride + 1));
      const mags = new Float32Array(outW * outH);
      let maxMag = 0;

      for (let oy = 0; oy < outH; oy++)
        for (let ox = 0; ox < outW; ox++) {
          let magSum = 0;
          for (let c = 0; c < 3; c++) {
            let gx = 0, gy = 0;
            for (let ky = 0; ky < k; ky++)
              for (let kx = 0; kx < k; kx++) {
                const px = getPixel(imageData.data, W, H, ox * stride + kx - padding, oy * stride + ky - padding, c);
                gx += px * kX[ky][kx];
                gy += px * kY[ky][kx];
              }
            magSum += Math.sqrt(gx * gx + gy * gy);
          }
          const mag = magSum / 3;
          mags[oy * outW + ox] = mag;
          if (mag > maxMag) maxMag = mag;
        }

      const output = new Uint8ClampedArray(outW * outH * 4);
      const scale = maxMag > 0 ? 255 / maxMag : 1;
      for (let i = 0; i < outW * outH; i++) {
        const v = clamp(mags[i] * scale);
        output[i * 4] = output[i * 4 + 1] = output[i * 4 + 2] = v;
        output[i * 4 + 3] = 255;
      }
      return new ImageData(output, outW, outH);
    }

    // Color contrast via Laplacian (signed): positive → red, negative → green.
    function computeColorContrast(imageData, k, stride, padding, contrastScale) {
      const W = imageData.width, H = imageData.height;
      const center = Math.floor(k / 2);
      const outW = Math.max(1, Math.floor((W + 2 * padding - k) / stride + 1));
      const outH = Math.max(1, Math.floor((H + 2 * padding - k) / stride + 1));
      const signed = new Float32Array(outW * outH);
      let maxAbs = 0;

      for (let oy = 0; oy < outH; oy++)
        for (let ox = 0; ox < outW; ox++) {
          let sum = 0;
          for (let ky = 0; ky < k; ky++)
            for (let kx = 0; kx < k; kx++) {
              const ix = ox * stride + kx - padding;
              const iy = oy * stride + ky - padding;
              const r = getPixel(imageData.data, W, H, ix, iy, 0);
              const g = getPixel(imageData.data, W, H, ix, iy, 1);
              const b = getPixel(imageData.data, W, H, ix, iy, 2);
              const luma = 0.299 * r + 0.587 * g + 0.114 * b;
              const isCenter = (kx === center && ky === center);
              sum += luma * (isCenter ? (k * k - 1) : -1);
            }
          signed[oy * outW + ox] = sum;
          if (Math.abs(sum) > maxAbs) maxAbs = Math.abs(sum);
        }

      const output = new Uint8ClampedArray(outW * outH * 4);
      const scale = maxAbs > 0 ? (255 * contrastScale) / maxAbs : 1;
      for (let i = 0; i < outW * outH; i++) {
        const v = signed[i] * scale;
        output[i * 4]     = v > 0 ? clamp(v)  : 0;   // R — positive
        output[i * 4 + 1] = v < 0 ? clamp(-v) : 0;   // G — negative
        output[i * 4 + 2] = 0;
        output[i * 4 + 3] = 255;
      }
      return new ImageData(output, outW, outH);
    }

    function computeFeature(imageData, ch, k, stride, padding, contrastScale) {
      if (ch === 'h_edge') return convolveAbs(imageData, buildKernel('h_edge', k), stride, padding);
      if (ch === 'v_edge') return convolveAbs(imageData, buildKernel('v_edge', k), stride, padding);
      if (ch === 'grad_mag') return computeGradientMagnitude(imageData, k, stride, padding);
      return computeColorContrast(imageData, k, stride, padding, contrastScale);
    }

    // ── Pooling ───────────────────────────────────────────────────────────────

    function applyPool(imageData, mode) {
      if (mode === 'none') return imageData;
      const isMax = mode.startsWith('max');
      const s = parseInt(mode.slice(3));
      const W = imageData.width, H = imageData.height;
      const outW = Math.max(1, Math.floor(W / s));
      const outH = Math.max(1, Math.floor(H / s));
      const output = new Uint8ClampedArray(outW * outH * 4);
      for (let oy = 0; oy < outH; oy++)
        for (let ox = 0; ox < outW; ox++) {
          const base = (oy * outW + ox) * 4;
          for (let c = 0; c < 3; c++) {
            let acc = 0, cnt = 0;
            for (let py = 0; py < s; py++)
              for (let px = 0; px < s; px++) {
                const ix = ox * s + px, iy = oy * s + py;
                if (ix < W && iy < H) {
                  const v = imageData.data[(iy * W + ix) * 4 + c];
                  acc = isMax ? Math.max(acc, v) : acc + v;
                  cnt++;
                }
              }
            output[base + c] = isMax ? acc : Math.round(acc / cnt);
          }
          output[base + 3] = 255;
        }
      return new ImageData(output, outW, outH);
    }

    // ── Overlay ───────────────────────────────────────────────────────────────

    // Blend feature map on top of the original image (scaled to feature resolution).
    // Pixels below threshold show only the original.
    function overlayFeature(originalRGB, featureMap, alpha, threshold) {
      const W = featureMap.width, H = featureMap.height;
      const scaledOrig = scaleImageTo(originalRGB, W, H);
      const result = new ImageData(W, H);
      for (let i = 0; i < result.data.length; i += 4) {
        const brightness = Math.max(featureMap.data[i], featureMap.data[i + 1], featureMap.data[i + 2]);
        const a = brightness >= threshold ? alpha : 0;
        for (let c = 0; c < 3; c++)
          result.data[i + c] = clamp((1 - a) * scaledOrig.data[i + c] + a * featureMap.data[i + c]);
        result.data[i + 3] = 255;
      }
      return result;
    }

    // ── Pipeline ──────────────────────────────────────────────────────────────

    function runPipeline() {
      if (!originalImageData) return;

      const ch           = document.getElementById('filterType').value;
      const numLayers    = Number(document.getElementById('numLayers').value);
      const k            = Number(document.getElementById('kernelSize').value);
      const stride       = Number(document.getElementById('stride').value);
      const paddingMode  = document.getElementById('paddingMode').value;
      const padding      = getPadding(paddingMode, k);
      const poolMode     = document.getElementById('poolMode').value;
      const alpha        = Number(document.getElementById('alpha').value);
      const threshold    = Number(document.getElementById('threshold').value);
      const contrastScale = Number(document.getElementById('contrastScale').value);

      // Layer 0: original color image for all channel slots
      const layers = [Object.fromEntries(CHANNELS.map(c => [c, originalImageData]))];

      for (let l = 1; l <= numLayers; l++) {
        const layerInput = avgChannels(CHANNELS.map(c => layers[l - 1][c]));
        const layerOutput = {};
        for (const c of CHANNELS) {
          let fm = computeFeature(layerInput, c, k, stride, padding, contrastScale);
          fm = applyPool(fm, poolMode);
          layerOutput[c] = fm;
        }
        layers.push(layerOutput);
      }

      renderGrid(layers, ch, alpha, threshold, k, stride, padding, paddingMode, poolMode, contrastScale);
    }

    // ── Rendering ─────────────────────────────────────────────────────────────

    function renderGrid(layers, ch, alpha, threshold, k, stride, padding, paddingMode, poolMode, contrastScale) {
      const grid = document.getElementById('layerGrid');
      grid.innerHTML = '';

      // Input column
      addCol(grid, 'Input', originalImageData, 'ch-input');

      // Layer columns
      for (let l = 1; l < layers.length; l++) {
        const fm = layers[l][ch];
        const overlaid = overlayFeature(originalImageData, fm, alpha, threshold);
        addCol(grid, `Layer ${l}`, overlaid, 'ch-' + ch);
      }

      // Formula
      const lines = [
        `filter: ${CHANNEL_LABELS[ch]}  |  kernel: ${k}×${k}  |  stride: ${stride}  |  padding: ${paddingMode} [p=${padding}]`,
        `α = ${alpha.toFixed(2)}  |  threshold = ${threshold}` + (ch === 'color_contrast' ? `  |  contrast scale = ${contrastScale}` : ''),
        poolMode !== 'none' ? `${poolMode.startsWith('max') ? 'MaxPool' : 'AvgPool'} ${poolMode.slice(3)}×${poolMode.slice(3)} → spatial ÷ ${poolMode.slice(3)}` : '',
        'overlay = (1 − α) × original + α × feature_map  (only where feature ≥ threshold)',
        ch === 'color_contrast' ? 'color contrast: red = positive Laplacian, green = negative' : '',
        ch === 'grad_mag'       ? 'gradient mag: bright = √(Gx² + Gy²), normalized per layer' : '',
      ].filter(Boolean);
      document.getElementById('formulaBox').innerHTML = lines.join('<br>');
    }

    function addCol(grid, label, imageData, chClass) {
      const col = document.createElement('div');
      col.className = 'layer-col';
      col.appendChild(makeEl('div', `col-label ${chClass}`, label));
      const cell = document.createElement('div');
      cell.className = `canvas-cell ${chClass}`;
      const canvas = document.createElement('canvas');
      canvas.width = imageData.width;
      canvas.height = imageData.height;
      canvas.getContext('2d').putImageData(imageData, 0, 0);
      cell.appendChild(canvas);
      col.appendChild(cell);
      grid.appendChild(col);
    }

    function makeEl(tag, cls, text) {
      const el = document.createElement(tag);
      el.className = cls;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    // ── Image loading ─────────────────────────────────────────────────────────

    function loadImageFromImg(img) {
      const scale = Math.min(MAX_SIZE / img.width, MAX_SIZE / img.height, 1);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const temp = document.createElement('canvas');
      temp.width = w; temp.height = h;
      temp.getContext('2d').drawImage(img, 0, 0, w, h);
      originalImageData = temp.getContext('2d').getImageData(0, 0, w, h);
      runPipeline();
    }

    const PRESET_IDS = { portrait: 338, building: 283, street: 320, nature: 260 };

    function loadPreset(name) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => loadImageFromImg(img);
      img.onerror = () => alert('Image load failed — check network connection');
      img.src = `https://picsum.photos/id/${PRESET_IDS[name]}/${MAX_SIZE}/${MAX_SIZE}`;
    }

    // ── Event listeners ───────────────────────────────────────────────────────

    document.getElementById('imageUpload').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => loadImageFromImg(img);
        img.onerror = () => alert('Image load failed — check file format');
        img.src = e.target.result;
      };
      reader.onerror = () => alert('File read failed');
      reader.readAsDataURL(file);
    });

    ['filterType', 'numLayers', 'kernelSize', 'stride', 'paddingMode', 'poolMode'].forEach(id =>
      document.getElementById(id).addEventListener('change', runPipeline)
    );

    // Sliders: update label + re-render
    [['alpha', 'alphaVal', v => Number(v).toFixed(2)],
     ['threshold', 'thresholdVal', v => v],
     ['contrastScale', 'contrastScaleVal', v => Number(v).toFixed(1)]
    ].forEach(([id, labelId, fmt]) => {
      const el = document.getElementById(id);
      el.addEventListener('input', () => {
        document.getElementById(labelId).textContent = fmt(el.value);
        runPipeline();
      });
    });

    function updateSamePaddingLabel() {
      const k = Number(document.getElementById('kernelSize').value);
      const p = Math.floor((k - 1) / 2);
      document.querySelector('#paddingMode option[value="same"]').textContent = `auto: p = ${p}`;
    }
    document.getElementById('kernelSize').addEventListener('change', updateSamePaddingLabel);

    updateSamePaddingLabel();
    loadPreset('street');
  </script>
</body>
</html>
