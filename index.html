<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNN Convolution Demo</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 24px; background: #f5f6f8; color: #222; }
    h1 { margin-top: 0; font-size: 28px; text-align: center; }
    .subtitle { color: #555; margin-bottom: 24px; line-height: 1.5; text-align: center; }
    .container { display: flex; flex-direction: column; gap: 16px; }
    .panel { background: white; border-radius: 14px; padding: 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
    .controls { display: flex; gap: 20px; align-items: flex-start; align-self: flex-start; }
    .controls-left { display: flex; flex-direction: column; gap: 10px; width: 180px; }
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    .full-span { grid-column: 1 / -1; }
    .control-group { min-width: 140px; max-width: 170px; margin-bottom: 0; }
    label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 13px; }
    select, input[type="file"] { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; background: white; font-size: 13px; }
    button { cursor: pointer; background: #222; color: white; border: none; font-weight: 700;
             padding: 8px; border-radius: 8px; font-size: 13px; }
    button:hover { opacity: 0.9; }
    .preset-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .preset-buttons button { background: #3b4252; font-size: 12px; width: 100%; }
    .preset-divider { border: none; border-top: 1px solid #e5e7eb; margin: 6px 0; }

    /* Layer selector buttons */
    .layer-btn-row { display: flex; gap: 5px; }
    .layer-btn {
      flex: 1; padding: 7px 4px; border-radius: 6px; border: 1px solid #ccc;
      background: white; font-weight: 700; font-size: 12px; cursor: pointer; color: #555;
    }
    .layer-btn.active { background: #1d4ed8; color: white; border-color: #1d4ed8; }
    .layer-btn:hover:not(.active) { background: #f3f4f6; }

    /* Image grid */
    #layerGrid { display: flex; gap: 16px; align-items: flex-start; overflow-x: auto; padding-bottom: 6px; }
    .layer-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .col-label {
      font-size: 11px; font-weight: 700; padding: 3px 10px;
      border-radius: 6px; white-space: nowrap; cursor: pointer; user-select: none;
    }
    .col-label.editing { outline: 2px solid #1d4ed8; outline-offset: 1px; }
    .col-label[data-layer-btn]:hover { background: #e2e8f0; }
    .col-row-label { font-size: 10px; font-weight: 700; color: #777; margin-top: 3px; text-align: center; }
    .ch-toggle-btn {
      margin-top: 2px; padding: 3px 12px; border-radius: 5px; border: 1px solid #d1d5db;
      background: #f9fafb; color: #555; font-size: 10px; font-weight: 600;
      cursor: pointer; width: auto; display: block;
    }
    .ch-toggle-btn:hover { background: #e5e7eb; }
    .ch-detail { display: none; flex-direction: column; align-items: center; gap: 5px; width: 100%; }
    .ch-detail.open { display: flex; }
    .ch-h_edge         { background: #dbeafe; color: #1d4ed8; }
    .ch-v_edge         { background: #dcfce7; color: #15803d; }
    .ch-diag_edge      { background: #fef3c7; color: #92400e; }
    .ch-color_contrast { background: #fee2e2; color: #991b1b; }
    .ch-texture        { background: #f3e8ff; color: #7e22ce; }
    .ch-input          { background: #f3f4f6; color: #374151; }
    .canvas-cell { flex: none; }
    .canvas-cell canvas {
      display: block; background: #111; max-width: 280px; width: auto;
      border-radius: 8px; border: 2px solid #e5e7eb; image-rendering: pixelated;
    }
    .canvas-cell.ch-h_edge canvas         { border-color: #93c5fd; }
    .canvas-cell.ch-v_edge canvas         { border-color: #86efac; }
    .canvas-cell.ch-diag_edge canvas      { border-color: #fcd34d; }
    .canvas-cell.ch-color_contrast canvas { border-color: #fca5a5; }
    .canvas-cell.ch-texture canvas        { border-color: #d8b4fe; }

    /* Bottom row */
    .bottom-row { display: flex; gap: 16px; align-items: stretch; }
    .kernel-display-area { flex: 1; display: flex; align-items: flex-start; justify-content: center; }
    .kernel-box {
      background: white; border-radius: 14px; padding: 16px 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08); text-align: center; width: 100%;
    }
    .kernel-box-title { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 12px; }
    .kernel-channels-row { display: flex; gap: 10px; align-items: flex-start; overflow-x: auto; padding: 2px 0; }
    .kernel-ch-block { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
    .kernel-ch-label { font-size: 11px; font-weight: 700; color: #555; }
    .kernel-filter-select {
      padding: 3px 4px; border-radius: 5px; border: 1px solid #ccc;
      font-size: 11px; background: white; cursor: pointer;
    }
    .kernel-table { border-collapse: collapse; margin: 0 auto; }
    .kernel-table td { width: 30px; height: 30px; text-align: center; border: 1px solid #e5e7eb; padding: 0; }
    .kernel-table input {
      width: 30px; height: 30px; border: none; background: transparent;
      text-align: center; font-family: Consolas, monospace; font-size: 11px; font-weight: 700;
      outline: none; cursor: text; -moz-appearance: textfield; appearance: textfield;
    }
    .kernel-table input::-webkit-outer-spin-button,
    .kernel-table input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .kernel-table input:focus { box-shadow: inset 0 0 0 2px #3b82f6; border-radius: 2px; }
    .kv-pos  { background: #dbeafe; color: #1d4ed8; }
    .kv-neg  { background: #fee2e2; color: #991b1b; }
    .kv-zero { background: #f3f4f6; color: #9ca3af; }
    .kernel-refresh-btn {
      margin-top: 14px; padding: 8px 32px; border-radius: 8px;
      background: #1d4ed8; color: white; border: none; font-weight: 700;
      font-size: 13px; cursor: pointer; display: block; margin-left: auto; margin-right: auto;
    }
    .kernel-refresh-btn:hover { background: #1e40af; }
  </style>
</head>
<body>
  <h1>CNN Convolution Demo</h1>

  <div class="container">
    <div class="panel">
      <div id="layerGrid"></div>
    </div>

    <div class="bottom-row">
      <div class="panel controls">
        <div class="controls-left">
          <div class="control-group">
            <label for="imageUpload">Upload Image</label>
            <input id="imageUpload" type="file" accept="image/*" />
          </div>
          <div class="control-group">
            <label>Example Images</label>
            <div class="preset-buttons">
              <button onclick="loadSynthetic('checkerboard')">Checker</button>
              <button onclick="loadSynthetic('h-stripes')">H-Stripes</button>
              <button onclick="loadSynthetic('v-stripes')">V-Stripes</button>
              <button onclick="loadSynthetic('diag-stripes')">Diagonal</button>
              <button onclick="loadSynthetic('square')">Square</button>
              <button onclick="loadSynthetic('circle')">Circle</button>
            </div>
            <div class="preset-divider"></div>
            <div class="preset-buttons">
              <button onclick="loadPreset('portrait')">Portrait</button>
              <button onclick="loadPreset('building')">Building</button>
              <button onclick="loadPreset('street')">Street</button>
              <button onclick="loadPreset('nature')">Nature</button>
            </div>
          </div>
        </div>

        <div class="controls-grid">
          <div class="control-group full-span">
            <label>Edit Layer</label>
            <div class="layer-btn-row" id="layerBtns"></div>
          </div>
          <div class="control-group">
            <label>Channels (this layer)</label>
            <select id="layerChannels">
              <option value="1" selected>1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
          <div class="control-group">
            <label for="numLayers">Layers</label>
            <select id="numLayers">
              <option value="1">1 Layer</option>
              <option value="2" selected>2 Layers</option>
              <option value="3">3 Layers</option>
              <option value="4">4 Layers</option>
            </select>
          </div>
          <div class="control-group full-span">
            <label for="kernelSize">Kernel Size (global)</label>
            <select id="kernelSize">
              <option value="3" selected>3 × 3</option>
              <option value="5">5 × 5</option>
              <option value="7">7 × 7</option>
            </select>
          </div>
          <div class="control-group">
            <label for="stride">Stride (this layer)</label>
            <select id="stride">
              <option value="1" selected>1</option>
              <option value="2">2</option>
              <option value="4">4</option>
            </select>
          </div>
          <div class="control-group">
            <label for="paddingMode">Padding (this layer)</label>
            <select id="paddingMode">
              <option value="same" selected>auto: p = 1</option>
              <option value="custom0">custom: p = 0</option>
              <option value="custom1">custom: p = 1</option>
              <option value="custom2">custom: p = 2</option>
              <option value="custom3">custom: p = 3</option>
              <option value="custom5">custom: p = 5</option>
            </select>
          </div>
          <div class="control-group full-span">
            <label>Pooling (this layer)</label>
            <select id="poolMode">
              <option value="none" selected>None</option>
              <option value="max2">MaxPool 2×2</option>
              <option value="max3">MaxPool 3×3</option>
              <option value="max4">MaxPool 4×4</option>
              <option value="avg2">AvgPool 2×2</option>
              <option value="avg3">AvgPool 3×3</option>
              <option value="avg4">AvgPool 4×4</option>
            </select>
          </div>
        </div>
      </div>

      <div class="kernel-display-area">
        <div class="kernel-box" id="kernelBox">
          <button class="kernel-refresh-btn" onclick="applyAndRefresh()">↻ Refresh</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const MAX_SIZE = 320;
    const ALPHA = 0.7;
    const THRESHOLD = 15;
    const CONTRAST_SCALE = 3.0;

    const FILTER_TYPES = ['h_edge', 'v_edge', 'diag_edge', 'color_contrast', 'texture'];
    const FILTER_LABELS = {
      h_edge: 'H-Edge', v_edge: 'V-Edge',
      diag_edge: 'Diag Edge', color_contrast: 'Color Contrast', texture: 'Texture'
    };

    let originalImageData = null;
    let selectedEditLayer = 1;
    let expandedLayers = new Set();

    // layerConfigs[0] = Layer 1, etc.  stride/paddingMode/poolMode are per-layer.
    let layerConfigs = Array.from({length: 4}, () => ({
      outChannels: 1,
      stride: 1,
      paddingMode: 'same',
      poolMode: 'none',
      channels: Array.from({length: 4}, (_, c) => ({
        filterType: FILTER_TYPES[c % FILTER_TYPES.length],
        customKernel: null
      }))
    }));

    // ── Utilities ──────────────────────────────────────────────────────────────

    function clamp(x) { return Math.max(0, Math.min(255, x)); }

    function getPixel(data, W, H, x, y, c) {
      if (x < 0 || x >= W || y < 0 || y >= H) return 0;
      return data[(y * W + x) * 4 + c];
    }

    function avgMaps(maps) {
      const w = maps[0].width, h = maps[0].height;
      const out = new ImageData(w, h);
      for (let i = 0; i < out.data.length; i += 4) {
        for (let c = 0; c < 3; c++) {
          let s = 0; for (const m of maps) s += m.data[i + c];
          out.data[i + c] = clamp(s / maps.length);
        }
        out.data[i + 3] = 255;
      }
      return out;
    }

    function scaleImageTo(imageData, targetW, targetH) {
      if (imageData.width === targetW && imageData.height === targetH) return imageData;
      const src = document.createElement('canvas');
      src.width = imageData.width; src.height = imageData.height;
      src.getContext('2d').putImageData(imageData, 0, 0);
      const dst = document.createElement('canvas');
      dst.width = targetW; dst.height = targetH;
      dst.getContext('2d').drawImage(src, 0, 0, targetW, targetH);
      return dst.getContext('2d').getImageData(0, 0, targetW, targetH);
    }

    // ── Kernel builders ────────────────────────────────────────────────────────

    // p such that floor((dim + 2p - k) / stride + 1) == dim  →  p = ceil(((stride-1)*dim + k - stride) / 2)
    function computeAutoPadding(dim, k, stride) {
      return Math.max(0, Math.ceil(((stride - 1) * dim + k - stride) / 2));
    }

    // inputW/inputH only needed for 'same' mode
    function getPadding(mode, k, stride, inputW, inputH) {
      if (mode === 'same') {
        const dim = Math.max(inputW || MAX_SIZE, inputH || MAX_SIZE);
        return computeAutoPadding(dim, k, stride);
      }
      return Number(mode.replace('custom', ''));
    }

    // Simulate image size after layers 0..(layerIdx-1) to get accurate input size for layer layerIdx
    function computeExpectedInputSize(layerIdx) {
      const k = Number(document.getElementById('kernelSize').value);
      let size = originalImageData
        ? Math.max(originalImageData.width, originalImageData.height)
        : MAX_SIZE;
      for (let l = 0; l < layerIdx; l++) {
        const cfg = layerConfigs[l];
        const p = getPadding(cfg.paddingMode, k, cfg.stride, size, size);
        size = Math.max(1, Math.floor((size + 2 * p - k) / cfg.stride + 1));
        if (cfg.poolMode !== 'none') {
          const s = parseInt(cfg.poolMode.slice(3));
          size = Math.max(1, Math.floor(size / s));
        }
      }
      return size;
    }

    function binomialRow(n) {
      const row = [1];
      for (let i = 1; i < n; i++) row[i] = row[i - 1] * (n - i) / i;
      return row;
    }

    function buildEdgeKernel(type, size) {
      const k = Array.from({length: size}, () => Array(size).fill(0));
      const c = Math.floor(size / 2);
      const binom = binomialRow(size);
      const deriv = Array.from({length: size}, (_, i) => i - c);
      for (let y = 0; y < size; y++)
        for (let x = 0; x < size; x++)
          k[y][x] = type === 'h_edge' ? deriv[y] * binom[x] : deriv[x] * binom[y];
      return k;
    }

    function buildDiagEdge(size) {
      // k[y][x] = y - x; main diagonal (y==x) = 0, sensitive to \ edges
      return Array.from({length: size}, (_, y) =>
        Array.from({length: size}, (_, x) => y - x)
      );
    }

    function buildTexture(size) {
      // checkerboard: k[y][x] = (-1)^(y+x)
      return Array.from({length: size}, (_, y) =>
        Array.from({length: size}, (_, x) => (y + x) % 2 === 0 ? 1 : -1)
      );
    }

    function buildLaplacian(size) {
      const c = Math.floor(size / 2);
      return Array.from({length: size}, (_, y) =>
        Array.from({length: size}, (_, x) => (x === c && y === c) ? size * size - 1 : -1)
      );
    }

    function getDefaultKernel(filterType, size) {
      if (filterType === 'h_edge') return buildEdgeKernel('h_edge', size);
      if (filterType === 'v_edge') return buildEdgeKernel('v_edge', size);
      if (filterType === 'diag_edge') return buildDiagEdge(size);
      if (filterType === 'texture') return buildTexture(size);
      return buildLaplacian(size);
    }

    // ── Convolutions ───────────────────────────────────────────────────────────

    function convolveAbs(imageData, kernel, stride, padding) {
      const W = imageData.width, H = imageData.height;
      const k = kernel.length;
      const outW = Math.max(1, Math.floor((W + 2 * padding - k) / stride + 1));
      const outH = Math.max(1, Math.floor((H + 2 * padding - k) / stride + 1));
      const output = new Uint8ClampedArray(outW * outH * 4);
      for (let oy = 0; oy < outH; oy++)
        for (let ox = 0; ox < outW; ox++) {
          const base = (oy * outW + ox) * 4;
          for (let c = 0; c < 3; c++) {
            let sum = 0;
            for (let ky = 0; ky < k; ky++)
              for (let kx = 0; kx < k; kx++)
                sum += getPixel(imageData.data, W, H, ox * stride + kx - padding, oy * stride + ky - padding, c) * kernel[ky][kx];
            output[base + c] = clamp(Math.abs(sum));
          }
          output[base + 3] = 255;
        }
      return new ImageData(output, outW, outH);
    }

    function computeColorContrast(imageData, stride, padding, kern) {
      const W = imageData.width, H = imageData.height;
      const k = kern.length;
      const outW = Math.max(1, Math.floor((W + 2 * padding - k) / stride + 1));
      const outH = Math.max(1, Math.floor((H + 2 * padding - k) / stride + 1));
      const signed = new Float32Array(outW * outH);
      let maxAbs = 0;
      for (let oy = 0; oy < outH; oy++)
        for (let ox = 0; ox < outW; ox++) {
          let sum = 0;
          for (let ky = 0; ky < k; ky++)
            for (let kx = 0; kx < k; kx++) {
              const ix = ox * stride + kx - padding, iy = oy * stride + ky - padding;
              const r = getPixel(imageData.data, W, H, ix, iy, 0);
              const g = getPixel(imageData.data, W, H, ix, iy, 1);
              const b = getPixel(imageData.data, W, H, ix, iy, 2);
              sum += (0.299 * r + 0.587 * g + 0.114 * b) * kern[ky][kx];
            }
          signed[oy * outW + ox] = sum;
          if (Math.abs(sum) > maxAbs) maxAbs = Math.abs(sum);
        }
      const output = new Uint8ClampedArray(outW * outH * 4);
      const scale = maxAbs > 0 ? (255 * CONTRAST_SCALE) / maxAbs : 1;
      for (let i = 0; i < outW * outH; i++) {
        const v = signed[i] * scale;
        output[i * 4]     = v > 0 ? clamp(v) : 0;
        output[i * 4 + 1] = v < 0 ? clamp(-v) : 0;
        output[i * 4 + 2] = 0;
        output[i * 4 + 3] = 255;
      }
      return new ImageData(output, outW, outH);
    }

    function applyFilter(imageData, filterType, k, stride, padding, customKernel) {
      if (filterType === 'color_contrast') {
        const kern = customKernel || buildLaplacian(k);
        return computeColorContrast(imageData, stride, padding, kern);
      }
      const kern = customKernel || getDefaultKernel(filterType, k);
      return convolveAbs(imageData, kern, stride, padding);
    }

    // ── Pooling ────────────────────────────────────────────────────────────────

    function applyPool(imageData, mode) {
      if (mode === 'none') return imageData;
      const isMax = mode.startsWith('max');
      const s = parseInt(mode.slice(3));
      const W = imageData.width, H = imageData.height;
      const outW = Math.max(1, Math.floor(W / s));
      const outH = Math.max(1, Math.floor(H / s));
      const output = new Uint8ClampedArray(outW * outH * 4);
      for (let oy = 0; oy < outH; oy++)
        for (let ox = 0; ox < outW; ox++) {
          const base = (oy * outW + ox) * 4;
          for (let c = 0; c < 3; c++) {
            let acc = 0, cnt = 0;
            for (let py = 0; py < s; py++)
              for (let px = 0; px < s; px++) {
                const ix = ox * s + px, iy = oy * s + py;
                if (ix < W && iy < H) {
                  const v = imageData.data[(iy * W + ix) * 4 + c];
                  acc = isMax ? Math.max(acc, v) : acc + v;
                  cnt++;
                }
              }
            output[base + c] = isMax ? acc : Math.round(acc / cnt);
          }
          output[base + 3] = 255;
        }
      return new ImageData(output, outW, outH);
    }

    // ── Overlay ────────────────────────────────────────────────────────────────

    function overlayFeature(originalRGB, featureMap) {
      const W = featureMap.width, H = featureMap.height;
      const scaledOrig = scaleImageTo(originalRGB, W, H);
      const result = new ImageData(W, H);
      for (let i = 0; i < result.data.length; i += 4) {
        const brightness = Math.max(featureMap.data[i], featureMap.data[i + 1], featureMap.data[i + 2]);
        const a = brightness >= THRESHOLD ? ALPHA : 0;
        for (let c = 0; c < 3; c++)
          result.data[i + c] = clamp((1 - a) * scaledOrig.data[i + c] + a * featureMap.data[i + c]);
        result.data[i + 3] = 255;
      }
      return result;
    }

    // ── Pipeline ───────────────────────────────────────────────────────────────

    function runPipeline() {
      if (!originalImageData) return;

      const numLayers = Number(document.getElementById('numLayers').value);
      const k         = Number(document.getElementById('kernelSize').value);

      // layers[0] = [originalImageData]; layers[l] = [fm_c0, fm_c1, ...]
      const layers = [[originalImageData]];

      for (let l = 0; l < numLayers; l++) {
        const cfg = layerConfigs[l];
        const stride  = cfg.stride;
        const prevMaps = layers[l];
        const inputImg = prevMaps.length === 1 ? prevMaps[0] : avgMaps(prevMaps);
        const padding = getPadding(cfg.paddingMode, k, stride, inputImg.width, inputImg.height);
        const outputMaps = [];
        for (let c = 0; c < cfg.outChannels; c++) {
          const chCfg = cfg.channels[c];
          let fm = applyFilter(inputImg, chCfg.filterType, k, stride, padding, chCfg.customKernel);
          fm = applyPool(fm, cfg.poolMode);
          outputMaps.push(fm);
        }
        layers.push(outputMaps);
      }

      renderGrid(layers, k);
    }

    // ── Rendering ──────────────────────────────────────────────────────────────

    function renderGrid(layers, k) {
      const grid = document.getElementById('layerGrid');
      grid.innerHTML = '';

      // Input column
      const inputCol = document.createElement('div');
      inputCol.className = 'layer-col';
      const inputLabel = document.createElement('div');
      inputLabel.className = 'col-label ch-input';
      inputLabel.textContent = 'Input';
      inputCol.appendChild(inputLabel);
      const inputCell = document.createElement('div');
      inputCell.className = 'canvas-cell';
      const inputCanvas = document.createElement('canvas');
      inputCanvas.width = originalImageData.width;
      inputCanvas.height = originalImageData.height;
      inputCanvas.getContext('2d').putImageData(originalImageData, 0, 0);
      inputCell.appendChild(inputCanvas);
      inputCol.appendChild(inputCell);
      grid.appendChild(inputCol);

      // Layer columns
      const numLayers = layers.length - 1;
      for (let l = 1; l <= numLayers; l++) {
        const cfg = layerConfigs[l - 1];
        const maps = layers[l];
        const col = document.createElement('div');
        col.className = 'layer-col';

        // Layer label (edit selector)
        const layerLabel = document.createElement('div');
        layerLabel.className = 'col-label ch-input' + (selectedEditLayer === l ? ' editing' : '');
        layerLabel.textContent = `Layer ${l}`;
        layerLabel.dataset.layerBtn = l;
        layerLabel.onclick = () => selectEditLayer(l);
        col.appendChild(layerLabel);

        // Aggregated image: mean of all channel feature maps, then overlay
        const aggMap = maps.length === 1 ? maps[0] : avgMaps(maps);
        const aggOverlaid = overlayFeature(originalImageData, aggMap);
        const aggCell = document.createElement('div');
        aggCell.className = 'canvas-cell';
        const aggCanvas = document.createElement('canvas');
        aggCanvas.width = aggOverlaid.width;
        aggCanvas.height = aggOverlaid.height;
        aggCanvas.getContext('2d').putImageData(aggOverlaid, 0, 0);
        aggCell.appendChild(aggCanvas);
        col.appendChild(aggCell);

        // Toggle button
        const isExpanded = expandedLayers.has(l);
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'ch-toggle-btn';
        toggleBtn.textContent = isExpanded
          ? '▲ collapse'
          : `▾ ${cfg.outChannels} ch`;

        // Per-channel detail section
        const detail = document.createElement('div');
        detail.className = 'ch-detail' + (isExpanded ? ' open' : '');
        for (let c = 0; c < maps.length; c++) {
          const chCfg = cfg.channels[c];
          const overlaid = overlayFeature(originalImageData, maps[c]);
          const rowLabel = document.createElement('div');
          rowLabel.className = 'col-row-label';
          rowLabel.textContent = `Ch${c + 1}: ${FILTER_LABELS[chCfg.filterType]}`;
          detail.appendChild(rowLabel);
          const cell = document.createElement('div');
          cell.className = `canvas-cell ch-${chCfg.filterType}`;
          const canvas = document.createElement('canvas');
          canvas.width = overlaid.width;
          canvas.height = overlaid.height;
          canvas.getContext('2d').putImageData(overlaid, 0, 0);
          cell.appendChild(canvas);
          detail.appendChild(cell);
        }

        toggleBtn.onclick = () => {
          if (expandedLayers.has(l)) {
            expandedLayers.delete(l);
            detail.className = 'ch-detail';
            toggleBtn.textContent = `▾ ${cfg.outChannels} ch`;
          } else {
            expandedLayers.add(l);
            detail.className = 'ch-detail open';
            toggleBtn.textContent = '▲ collapse';
          }
        };

        col.appendChild(toggleBtn);
        col.appendChild(detail);
        grid.appendChild(col);
      }
    }

    // ── Kernel editor ──────────────────────────────────────────────────────────

    function kernelTableHTML(kernel, tableId) {
      let html = `<table class="kernel-table" id="${tableId}"><tbody>`;
      for (let y = 0; y < kernel.length; y++) {
        html += '<tr>';
        for (let x = 0; x < kernel[y].length; x++) {
          const v = kernel[y][x];
          const cls = v > 0 ? 'kv-pos' : v < 0 ? 'kv-neg' : 'kv-zero';
          html += `<td class="${cls}"><input type="number" value="${v}" step="1" min="-9999" max="9999" oninput="syncCellColor(this)" /></td>`;
        }
        html += '</tr>';
      }
      return html + '</tbody></table>';
    }

    function syncCellColor(inp) {
      const v = Number(inp.value);
      inp.parentElement.className = v > 0 ? 'kv-pos' : v < 0 ? 'kv-neg' : 'kv-zero';
    }

    function readTable(tableId) {
      const tbl = document.getElementById(tableId);
      return Array.from(tbl.querySelectorAll('tr'), row =>
        Array.from(row.querySelectorAll('input'), inp => Number(inp.value))
      );
    }

    function renderKernelBox() {
      const k = Number(document.getElementById('kernelSize').value);
      const l = selectedEditLayer;
      const cfg = layerConfigs[l - 1];
      const expectedSize = computeExpectedInputSize(l - 1);
      const p = getPadding(cfg.paddingMode, k, cfg.stride, expectedSize, expectedSize);
      const poolStr = cfg.poolMode === 'none' ? 'no pool'
        : `${cfg.poolMode.startsWith('max') ? 'MaxPool' : 'AvgPool'} ${cfg.poolMode.slice(3)}×${cfg.poolMode.slice(3)}`;
      const box = document.getElementById('kernelBox');

      let html = `<div class="kernel-box-title">`;
      html += `Layer ${l}  ·  ${cfg.outChannels} ch  ·  ${k}×${k}  ·  stride=${cfg.stride}  p=${p}  ${poolStr}`;
      html += `</div>`;
      html += `<div class="kernel-channels-row">`;

      for (let c = 0; c < cfg.outChannels; c++) {
        const chCfg = cfg.channels[c];
        const kern = chCfg.customKernel && chCfg.customKernel.length === k
          ? chCfg.customKernel
          : getDefaultKernel(chCfg.filterType, k);
        const tblId = `kTbl_${l}_${c}`;

        html += `<div class="kernel-ch-block">`;
        html += `<div class="kernel-ch-label">Ch ${c + 1}</div>`;
        html += `<select class="kernel-filter-select" onchange="onChannelFilterChange(${l - 1},${c},this.value)">`;
        for (const ft of FILTER_TYPES)
          html += `<option value="${ft}"${ft === chCfg.filterType ? ' selected' : ''}>${FILTER_LABELS[ft]}</option>`;
        html += `</select>`;
        html += kernelTableHTML(kern, tblId);
        html += `</div>`;
      }

      html += `</div>`;

      const btn = box.querySelector('.kernel-refresh-btn');
      box.innerHTML = html;
      box.appendChild(btn);
    }

    function onChannelFilterChange(layerIdx, channelIdx, newFilterType) {
      layerConfigs[layerIdx].channels[channelIdx].filterType = newFilterType;
      layerConfigs[layerIdx].channels[channelIdx].customKernel = null;
      renderKernelBox();
    }

    function applyAndRefresh() {
      const k = Number(document.getElementById('kernelSize').value);
      const l = selectedEditLayer;
      const cfg = layerConfigs[l - 1];
      for (let c = 0; c < cfg.outChannels; c++) {
        cfg.channels[c].customKernel = readTable(`kTbl_${l}_${c}`);
      }
      runPipeline();
    }

    function resetAllCustomKernels() {
      layerConfigs.forEach(cfg => cfg.channels.forEach(ch => { ch.customKernel = null; }));
    }

    // ── Layer selector UI ──────────────────────────────────────────────────────

    function selectEditLayer(l) {
      selectedEditLayer = l;
      const cfg = layerConfigs[l - 1];
      document.getElementById('layerChannels').value = cfg.outChannels;
      document.getElementById('stride').value = cfg.stride;
      document.getElementById('paddingMode').value = cfg.paddingMode;
      document.getElementById('poolMode').value = cfg.poolMode;
      updateLayerBtns();
      updateSamePaddingLabel();
      renderKernelBox();
      // Sync the grid layer label highlights without re-running the pipeline
      document.querySelectorAll('[data-layer-btn]').forEach(el => {
        const n = Number(el.dataset.layerBtn);
        el.className = 'col-label ch-input' + (n === l ? ' editing' : '');
      });
    }

    function updateLayerBtns() {
      const numLayers = Number(document.getElementById('numLayers').value);
      if (selectedEditLayer > numLayers) selectedEditLayer = numLayers;
      const row = document.getElementById('layerBtns');
      row.innerHTML = '';
      for (let l = 1; l <= numLayers; l++) {
        const btn = document.createElement('button');
        btn.className = 'layer-btn' + (l === selectedEditLayer ? ' active' : '');
        btn.textContent = `L${l}`;
        btn.onclick = () => selectEditLayer(l);
        row.appendChild(btn);
      }
    }

    // ── Event listeners ────────────────────────────────────────────────────────

    document.getElementById('imageUpload').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => loadImageFromImg(img);
        img.onerror = () => alert('Image load failed');
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('numLayers').addEventListener('change', () => {
      updateLayerBtns();
      selectEditLayer(selectedEditLayer); // sync dropdowns to (possibly clamped) layer
    });

    document.getElementById('layerChannels').addEventListener('change', () => {
      layerConfigs[selectedEditLayer - 1].outChannels = Number(document.getElementById('layerChannels').value);
      renderKernelBox();
    });

    document.getElementById('kernelSize').addEventListener('change', () => {
      resetAllCustomKernels();
      updateSamePaddingLabel();
      renderKernelBox();
    });

    document.getElementById('stride').addEventListener('change', () => {
      layerConfigs[selectedEditLayer - 1].stride = Number(document.getElementById('stride').value);
      updateSamePaddingLabel();
      renderKernelBox();
    });

    document.getElementById('paddingMode').addEventListener('change', () => {
      layerConfigs[selectedEditLayer - 1].paddingMode = document.getElementById('paddingMode').value;
      renderKernelBox();
    });

    document.getElementById('poolMode').addEventListener('change', () => {
      layerConfigs[selectedEditLayer - 1].poolMode = document.getElementById('poolMode').value;
      renderKernelBox();
    });

    function updateSamePaddingLabel() {
      const l = selectedEditLayer;
      const cfg = layerConfigs[l - 1];
      const k = Number(document.getElementById('kernelSize').value);
      const expectedSize = computeExpectedInputSize(l - 1);
      const p = computeAutoPadding(expectedSize, k, cfg.stride);
      document.querySelector('#paddingMode option[value="same"]').textContent = `auto: p = ${p}`;
    }

    // ── Image loading ──────────────────────────────────────────────────────────

    function loadImageFromImg(img) {
      const scale = Math.min(MAX_SIZE / img.width, MAX_SIZE / img.height, 1);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const temp = document.createElement('canvas');
      temp.width = w; temp.height = h;
      temp.getContext('2d').drawImage(img, 0, 0, w, h);
      originalImageData = temp.getContext('2d').getImageData(0, 0, w, h);
      runPipeline();
    }

    function loadSynthetic(type) {
      const S = MAX_SIZE;
      const c = document.createElement('canvas');
      c.width = S; c.height = S;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, S, S);
      ctx.fillStyle = '#fff';

      const tile   = Math.round(S / 10); // 32px — checkerboard block size
      const stripe = Math.round(S / 16); // 20px — stripe width

      if (type === 'checkerboard') {
        for (let y = 0; y < S; y += tile)
          for (let x = 0; x < S; x += tile)
            if (((x / tile) + (y / tile)) % 2 === 0)
              ctx.fillRect(x, y, tile, tile);

      } else if (type === 'h-stripes') {
        for (let y = 0; y < S; y += stripe * 2)
          ctx.fillRect(0, y, S, stripe);

      } else if (type === 'v-stripes') {
        for (let x = 0; x < S; x += stripe * 2)
          ctx.fillRect(x, 0, stripe, S);

      } else if (type === 'diag-stripes') {
        const img = ctx.getImageData(0, 0, S, S);
        const d = img.data;
        for (let y = 0; y < S; y++)
          for (let x = 0; x < S; x++) {
            const v = (x + y) % (stripe * 2) < stripe ? 255 : 0;
            const i = (y * S + x) * 4;
            d[i] = d[i + 1] = d[i + 2] = v;
            d[i + 3] = 255;
          }
        ctx.putImageData(img, 0, 0);

      } else if (type === 'square') {
        const sq = Math.round(S * 0.4);
        const off = Math.round((S - sq) / 2);
        ctx.fillRect(off, off, sq, sq);

      } else if (type === 'circle') {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = Math.round(S * 0.04);
        ctx.beginPath();
        ctx.arc(S / 2, S / 2, Math.round(S * 0.35), 0, Math.PI * 2);
        ctx.stroke();
      }

      originalImageData = c.getContext('2d').getImageData(0, 0, S, S);
      runPipeline();
    }

    const PRESET_IDS = { portrait: 338, building: 283, street: 320, nature: 260 };

    function loadPreset(name) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => loadImageFromImg(img);
      img.onerror = () => alert('Image load failed — check network connection');
      img.src = `https://picsum.photos/id/${PRESET_IDS[name]}/${MAX_SIZE}/${MAX_SIZE}`;
    }

    // ── Init ───────────────────────────────────────────────────────────────────

    updateSamePaddingLabel();
    updateLayerBtns();
    renderKernelBox();
    loadPreset('street');
  </script>
</body>
</html>
