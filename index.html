<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNN Convolution Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #e8ecf0; color: #1e293b; }

    .page-title { text-align: center; padding: 18px 0 6px; font-size: 22px; font-weight: 700; }
    .status-bar { text-align: center; font-size: 11px; color: #94a3b8; margin-bottom: 12px; }

    .main { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: white; border-radius: 10px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

    /* ── Top section ── */
    .top-section { display: flex; align-items: flex-start; }
    .pipeline { flex: 1; min-width: 0; display: flex; align-items: flex-start; }
    .pipe-col  { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
    .pipe-label {
      font-size: 12px; font-weight: 600; color: #64748b;
      margin-bottom: 6px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    }
    .pipe-label.sel { background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb; }
    .pipe-canvas {
      width: 100%; aspect-ratio: 1; display: block;
      border-radius: 5px; image-rendering: pixelated;
      background: #f1f5f9; border: 1px solid #e2e8f0;
    }
    .pipe-info { font-size: 9px; color: #94a3b8; margin-top: 4px; text-align: center; }
    .expand-btn {
      margin-top: 5px; font-size: 10px; padding: 2px 10px;
      border: 1px solid #e2e8f0; border-radius: 4px;
      background: white; color: #64748b; cursor: pointer; white-space: nowrap;
    }
    .expand-btn:hover { border-color: #94a3b8; }
    .expand-btn.open  { border-color: #3b82f6; color: #2563eb; background: #eff6ff; }
    .expand-sect { display: none; width: 100%; margin-top: 6px; }
    .expand-sect.open { display: block; }
    .pipe-arrow { flex-shrink: 0; padding: 0 4px; padding-top: 32px; color: #cbd5e1; font-size: 18px; }
    .pool-sep { flex-shrink: 0; width: 26px; display: flex; flex-direction: column; align-items: center; padding-top: 24px; }
    .pool-sep-line  { width: 1px; height: 14px; background: #e2e8f0; }
    .pool-sep-txt   { font-size: 7.5px; color: #94a3b8; writing-mode: vertical-rl; padding: 3px 0; white-space: nowrap; }
    .pool-sep-line2 { width: 1px; flex: 1; min-height: 14px; background: #e2e8f0; }
    .pred-divider { width: 1px; background: #f1f5f9; flex-shrink: 0; margin: 0 14px; align-self: stretch; }
    .pred-panel { width: 185px; flex-shrink: 0; }
    .ctrl-title { font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 10px; }
    .pred-row   { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
    .pred-name  { font-size: 10px; color: #475569; width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
    .pred-bar-bg { flex: 1; height: 10px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
    .pred-bar-fill { height: 100%; border-radius: 999px; background: #93c5fd; transition: width .3s; }
    .pred-bar-fill.top { background: #2563eb; }
    .pred-pct { font-size: 9px; color: #64748b; width: 30px; text-align: right; flex-shrink: 0; }

    /* ── Bottom 2-col ── */
    .bottom-row { display: flex; gap: 12px; align-items: flex-start; }
    .left-ctrl  { flex: 0 0 310px; display: flex; flex-direction: column; gap: 0; }
    .right-ctrl { flex: 1; min-width: 0; }

    /* Left col */
    .upload-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .browse-btn {
      font-size: 11px; padding: 4px 12px;
      border: 1px solid #e2e8f0; border-radius: 5px;
      background: white; cursor: pointer; color: #475569;
    }
    .browse-btn:hover { border-color: #94a3b8; }
    #uploadInput { display: none; }
    #uploadName  { font-size: 10px; color: #94a3b8; }
    .img-sec-lbl { font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 6px; }
    .img-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
    .img-btn {
      font-size: 9px; padding: 4px 2px;
      border: 1px solid #e2e8f0; border-radius: 4px;
      background: white; cursor: pointer; color: #475569;
      text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .img-btn:hover  { border-color: #94a3b8; }
    .img-btn.active { border-color: #3b82f6; color: #2563eb; background: #eff6ff; }

    .section-sep { height: 1px; background: #f1f5f9; margin: 14px 0; }

    /* Layer config */
    .layer-tabs { display: flex; gap: 3px; margin-bottom: 10px; flex-wrap: wrap; }
    .layer-tab {
      font-size: 10px; padding: 3px 9px;
      border: 1px solid #e2e8f0; border-radius: 5px;
      background: white; color: #64748b; cursor: pointer;
    }
    .layer-tab.active { border-color: #3b82f6; color: #2563eb; background: #eff6ff; font-weight: 600; }
    .cfg-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; font-size: 12px; }
    .cfg-k   { color: #64748b; }
    .cfg-v   { color: #1e293b; font-weight: 600; font-family: monospace; }
    .cfg-sel {
      font-size: 11px; padding: 3px 6px;
      border: 1px solid #e2e8f0; border-radius: 4px;
      background: white; color: #1e293b; cursor: pointer;
      font-family: monospace; font-weight: 600;
    }
    .cfg-sel:focus { outline: none; border-color: #3b82f6; }
    .cfg-sel.modified { border-color: #f59e0b; color: #b45309; background: #fffbeb; }
    .small-btn {
      font-size: 10px; padding: 3px 10px;
      border: 1px solid #e2e8f0; border-radius: 4px;
      background: white; color: #64748b; cursor: pointer; margin-top: 4px;
    }
    .small-btn:hover { border-color: #94a3b8; }

    /* ── Right col: all kernels ── */
    .k-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    .k-layer-info { font-size: 13px; font-weight: 700; color: #1e293b; }
    .k-hint { font-size: 10px; color: #94a3b8; margin-bottom: 12px; }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .action-btn {
      font-size: 11px; padding: 4px 12px;
      border: 1px solid #e2e8f0; border-radius: 5px;
      background: white; color: #475569; cursor: pointer; font-weight: 600;
    }
    .action-btn:hover { border-color: #3b82f6; color: #2563eb; background: #eff6ff; }
    .action-btn.danger:hover { border-color: #ef4444; color: #dc2626; background: #fef2f2; }

    /* All-kernels grid */
    .all-kernels { display: flex; flex-wrap: wrap; gap: 14px; }

    /* Individual kernel block */
    .kern-block {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 6px; border-radius: 8px; border: 2px solid transparent;
      cursor: pointer; transition: border-color .15s;
    }
    .kern-block:hover { border-color: #e2e8f0; }
    .kern-block.sel   { border-color: #3b82f6; background: #f8faff; }
    .kern-block.modified { border-color: #f59e0b; }
    .kern-block.sel.modified { border-color: #f59e0b; background: #fffdf0; }

    .kern-block-label {
      font-size: 10px; font-weight: 600; color: #64748b;
      user-select: none; -webkit-user-select: none;
    }
    .kern-block.sel .kern-block-label { color: #2563eb; }
    .kern-block.modified .kern-block-label { color: #b45309; }

    /* 3×3 mini kernel grid */
    .kern-mini {
      display: grid;
      grid-template-columns: repeat(3, 42px);
      gap: 3px;
    }

    .kern-cell {
      width: 42px; height: 42px;
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #1e293b;
      cursor: text; outline: none;
      user-select: text; -webkit-user-select: text;
      transition: box-shadow .1s;
    }
    .kern-cell:focus {
      box-shadow: inset 0 0 0 2px rgba(59,130,246,.7);
      z-index: 1;
    }

    .dim-txt { font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>

<div class="page-title">CNN Convolution Demo</div>
<div class="status-bar" id="statusBar">Loading model…</div>

<div class="main">
  <div class="card top-section">
    <div class="pipeline" id="pipeline"></div>
    <div class="pred-divider"></div>
    <div class="pred-panel">
      <div class="ctrl-title">Prediction</div>
      <div id="predBars"><span class="dim-txt">—</span></div>
    </div>
  </div>

  <div class="bottom-row">

    <!-- Left: images + layer config -->
    <div class="card left-ctrl">
      <div class="ctrl-title">Upload Image</div>
      <div class="upload-row">
        <button class="browse-btn" onclick="document.getElementById('uploadInput').click()">Browse…</button>
        <input type="file" id="uploadInput" accept="image/*">
        <span id="uploadName">No file…</span>
      </div>
      <div class="img-sec-lbl">Example Images</div>
      <div class="img-grid" id="imgGrid"></div>

      <div class="section-sep"></div>

      <div class="ctrl-title">Edit Layer</div>
      <div class="layer-tabs" id="layerTabs"></div>
      <div id="cfgRows"></div>
    </div>

    <!-- Right: all kernel weights for selected layer -->
    <div class="card right-ctrl">
      <div class="k-header">
        <div class="k-layer-info" id="kLayerInfo">—</div>
        <div class="btn-row">
          <button class="action-btn" id="refreshBtn">▶ Refresh</button>
          <button class="action-btn danger" onclick="resetKernel()">↺ Reset filter</button>
          <button class="action-btn danger" onclick="resetAllKernels()">↺ Reset all</button>
        </div>
      </div>
      <div class="k-hint">Click any cell to edit · Enter to confirm · Esc to cancel · selected filter highlighted in blue</div>
      <div class="all-kernels" id="allKernelsGrid"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script>
const MODEL_URL   = 'https://poloclub.github.io/cnn-explainer/assets/data/model.json';
const IMG_BASE    = 'https://poloclub.github.io/cnn-explainer/assets/img/';
const CLASS_NAMES = ['lifeboat','ladybug','pizza','bell pepper','school bus',
                     'koala','espresso','red panda','orange','sport car'];
const IMAGES = [
  {label:'Espresso',    file:'espresso_1.jpeg'},
  {label:'Ladybug',     file:'bug_1.jpeg'},
  {label:'Pizza',       file:'pizza_1.jpeg'},
  {label:'Bell Pepper', file:'pepper_1.jpeg'},
  {label:'School Bus',  file:'bus_1.jpeg'},
  {label:'Koala',       file:'koala_1.jpeg'},
  {label:'Lifeboat',    file:'boat_1.jpeg'},
  {label:'Red Panda',   file:'panda_1.jpeg'},
  {label:'Orange',      file:'orange_1.jpeg'},
  {label:'Sport Car',   file:'car_1.jpeg'},
];
const LN = ['Layer 1','Layer 2','Layer 3','Layer 4'];
const DEFAULT_PARAMS = [
  { stride:1, padding:'valid', poolAfter:false },
  { stride:1, padding:'valid', poolAfter:true  },
  { stride:1, padding:'valid', poolAfter:false },
  { stride:1, padding:'valid', poolAfter:true  },
];

let model        = null;
let convLayers   = [];
let flattenLayer = null;
let denseLayer   = null;
let imgTensor    = null;
let fmCache      = [];
let selLayer     = 0;
let selFilter    = 0;
let expanded     = [false,false,false,false];
let layerParams  = DEFAULT_PARAMS.map(p=>({...p}));
// Per (layer, filter): null = use model weights, or [[r0c0..r0c2],[r1c0..],[r2c0..]]
let kernelOverrides = Array.from({length:4}, ()=>Array.from({length:10}, ()=>null));

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    setStatus('Loading model…');
    model = await tf.loadLayersModel(MODEL_URL);

    for (let i = 1; i < model.layers.length; i++) {
      const l = model.layers[i], p = model.layers[i-1];
      if (l.getClassName()==='Activation' && p.getClassName()==='Conv2D') convLayers.push(p);
      if (l.getClassName()==='Flatten') flattenLayer = l;
      if (l.getClassName()==='Dense')   denseLayer   = l;
    }

    buildPipeline();
    buildLayerTabs();
    buildImgGrid();

    document.getElementById('refreshBtn').onclick = run;
    document.getElementById('uploadInput').addEventListener('change', async e=>{
      const f=e.target.files[0]; if(!f) return;
      document.getElementById('uploadName').textContent=f.name.slice(0,16);
      document.querySelectorAll('.img-btn').forEach(b=>b.classList.remove('active'));
      await loadURL(URL.createObjectURL(f), true);
      await run();
    });

    selectLayer(0);
    await loadImg(0);
    await run();
    setStatus('Tiny VGG · 4 conv layers · 10 filters each · click cells to edit kernel weights');
  } catch(e) {
    setStatus('Error: '+e.message);
    console.error(e);
  }
}

// ── Pipeline ──────────────────────────────────────────────────────────────────
function buildPipeline() {
  const pl = document.getElementById('pipeline');
  pl.innerHTML = '';

  const ic = document.createElement('div');
  ic.className = 'pipe-col';
  ic.innerHTML = `<div class="pipe-label">Input</div>
    <canvas id="inputCanvas" class="pipe-canvas" width="64" height="64"></canvas>
    <div class="pipe-info">64×64 · 3 ch</div>`;
  pl.appendChild(ic);

  convLayers.forEach((_, li) => {
    const arrow = document.createElement('div');
    arrow.className = 'pipe-arrow'; arrow.textContent = '→';
    pl.appendChild(arrow);

    if (li===2) {
      const sep = document.createElement('div');
      sep.className = 'pool-sep';
      sep.innerHTML = '<div class="pool-sep-line"></div><span class="pool-sep-txt">MaxPool ÷2</span><div class="pool-sep-line2"></div>';
      pl.appendChild(sep);
    }
    pl.appendChild(makeLayerCol(li));
  });
}

function makeLayerCol(li) {
  const col = document.createElement('div');
  col.className = 'pipe-col';

  const lbl = document.createElement('div');
  lbl.className = 'pipe-label'+(li===selLayer?' sel':'');
  lbl.id = `plbl${li}`; lbl.textContent = LN[li];
  col.appendChild(lbl);

  const c = document.createElement('canvas');
  c.className = 'pipe-canvas'; c.id = `pc${li}`;
  c.width = 60; c.height = 60;
  col.appendChild(c);

  const inf = document.createElement('div');
  inf.className = 'pipe-info'; inf.id = `pinf${li}`; inf.textContent = '—';
  col.appendChild(inf);

  const btn = document.createElement('button');
  btn.className = 'expand-btn'; btn.id = `ebtn${li}`;
  btn.textContent = '▼ Filter view';
  btn.onclick = ()=>toggleExpand(li);
  col.appendChild(btn);

  const sect = document.createElement('div');
  sect.className = 'expand-sect'; sect.id = `esect${li}`;
  const efc = document.createElement('canvas');
  efc.className = 'pipe-canvas'; efc.id = `efc${li}`;
  efc.width = 60; efc.height = 60;
  const einf = document.createElement('div');
  einf.className = 'pipe-info'; einf.id = `efcinf${li}`;
  einf.textContent = `Filter ${selFilter}`;
  sect.append(efc, einf);
  col.appendChild(sect);

  return col;
}

function toggleExpand(li) {
  expanded[li] = !expanded[li];
  const sect = document.getElementById(`esect${li}`);
  const btn  = document.getElementById(`ebtn${li}`);
  sect.classList.toggle('open', expanded[li]);
  btn.classList.toggle('open', expanded[li]);
  btn.textContent = expanded[li] ? '▲ Collapse' : '▼ Filter view';
  if (expanded[li] && fmCache[li]) {
    const data = fmCache[li];
    const f = Math.min(selFilter, data[0][0].length-1);
    paintToCanvas(document.getElementById(`efc${li}`), data, data.length, data[0].length, f);
    document.getElementById(`efcinf${li}`).textContent = `Filter ${f}`;
  }
}

// ── Controls ──────────────────────────────────────────────────────────────────
function buildLayerTabs() {
  const tabs = document.getElementById('layerTabs');
  convLayers.forEach((_, li) => {
    const t = document.createElement('button');
    t.className = 'layer-tab'+(li===0?' active':'');
    t.textContent = LN[li];
    t.onclick = ()=>selectLayer(li);
    tabs.appendChild(t);
  });
}

function buildImgGrid() {
  const grid = document.getElementById('imgGrid');
  IMAGES.forEach((img,i) => {
    const btn = document.createElement('button');
    btn.className = 'img-btn'+(i===0?' active':'');
    btn.textContent = img.label;
    btn.onclick = async ()=>{ await loadImg(i); await run(); };
    grid.appendChild(btn);
  });
}

function selectLayer(li) {
  selLayer=li; selFilter=0;
  document.querySelectorAll('.layer-tab').forEach((t,i)=>t.classList.toggle('active',i===li));
  convLayers.forEach((_,i)=>{
    const lbl=document.getElementById(`plbl${i}`);
    if(lbl) lbl.className='pipe-label'+(i===li?' sel':'');
  });
  updateLayerCfg();
  renderAllKernels();
}

function updateLayerCfg() {
  const layer = convLayers[selLayer];
  const wshp  = layer.getWeights()[0].shape;
  const inC=wshp[2], outC=wshp[3];
  const p = layerParams[selLayer];
  const def = DEFAULT_PARAMS[selLayer];
  const fmInfo = fmCache[selLayer]?`${fmCache[selLayer].length}×${fmCache[selLayer][0].length}`:'—';
  const isStrMod = p.stride!==def.stride;
  const isPadMod = p.padding!==def.padding;
  const isPoolMod= p.poolAfter!==def.poolAfter;

  document.getElementById('cfgRows').innerHTML = `
    <div class="cfg-row"><span class="cfg-k">Channels (in)</span>  <span class="cfg-v">${inC}</span></div>
    <div class="cfg-row"><span class="cfg-k">Channels (out)</span> <span class="cfg-v">${outC}</span></div>
    <div class="cfg-row"><span class="cfg-k">Kernel Size</span>    <span class="cfg-v">3 × 3</span></div>
    <div class="cfg-row">
      <span class="cfg-k">Stride</span>
      <select class="cfg-sel${isStrMod?' modified':''}" id="strideCtrl" onchange="onParamChange('stride',this.value)">
        <option value="1"${p.stride===1?' selected':''}>1</option>
        <option value="2"${p.stride===2?' selected':''}>2</option>
        <option value="3"${p.stride===3?' selected':''}>3</option>
      </select>
    </div>
    <div class="cfg-row">
      <span class="cfg-k">Padding</span>
      <select class="cfg-sel${isPadMod?' modified':''}" id="paddingCtrl" onchange="onParamChange('padding',this.value)">
        <option value="valid"${p.padding==='valid'?' selected':''}>valid</option>
        <option value="same"${p.padding==='same'?' selected':''}>same</option>
      </select>
    </div>
    <div class="cfg-row">
      <span class="cfg-k">Pooling (after)</span>
      <select class="cfg-sel${isPoolMod?' modified':''}" id="poolCtrl" onchange="onParamChange('poolAfter',this.value)">
        <option value="none"${!p.poolAfter?' selected':''}>None</option>
        <option value="max"${p.poolAfter?' selected':''}>MaxPool 2×2</option>
      </select>
    </div>
    <div class="cfg-row"><span class="cfg-k">Output size</span>    <span class="cfg-v">${fmInfo}</span></div>
    <button class="small-btn" onclick="resetLayerParams()">↺ Reset to default</button>
  `;
}

function onParamChange(param, value) {
  if (param==='stride')    layerParams[selLayer].stride   = parseInt(value);
  if (param==='padding')   layerParams[selLayer].padding  = value;
  if (param==='poolAfter') layerParams[selLayer].poolAfter= (value==='max');
  run();
}

function resetLayerParams() {
  layerParams[selLayer] = {...DEFAULT_PARAMS[selLayer]};
  updateLayerCfg();
  run();
}

// ── Kernel display (all filters, editable) ────────────────────────────────────
function getKernelValsFor(li, fi) {
  if (kernelOverrides[li][fi]) return kernelOverrides[li][fi];
  const arr = convLayers[li].getWeights()[0].arraySync(); // [3,3,inC,outC]
  const inC = arr[0][0].length;
  let bestC=0, bestM=0;
  for (let c=0;c<inC;c++) {
    let m=0;
    for (let y=0;y<3;y++) for (let x=0;x<3;x++) m=Math.max(m,Math.abs(arr[y][x][c][fi]));
    if(m>bestM){bestM=m;bestC=c;}
  }
  return Array.from({length:3},(_,y)=>Array.from({length:3},(_,x)=>arr[y][x][bestC][fi]));
}

function renderAllKernels() {
  const container = document.getElementById('allKernelsGrid');
  container.innerHTML = '';

  const isAnyMod = kernelOverrides[selLayer].some(o=>o!==null);
  document.getElementById('kLayerInfo').textContent =
    `${LN[selLayer]} · 10 filters${isAnyMod?' · modified':''}`;

  // Read raw weights once for the entire layer
  const rawArr = convLayers[selLayer].getWeights()[0].arraySync(); // [3,3,inC,outC]
  const inC = rawArr[0][0].length;

  for (let fi=0;fi<10;fi++) {
    const isOvr = kernelOverrides[selLayer][fi] !== null;

    // Get display values
    let vals;
    if (isOvr) {
      vals = kernelOverrides[selLayer][fi];
    } else {
      let bestC=0, bestM=0;
      for (let c=0;c<inC;c++) {
        let m=0;
        for (let y=0;y<3;y++) for (let x=0;x<3;x++) m=Math.max(m,Math.abs(rawArr[y][x][c][fi]));
        if(m>bestM){bestM=m;bestC=c;}
      }
      vals = Array.from({length:3},(_,y)=>Array.from({length:3},(_,x)=>rawArr[y][x][bestC][fi]));
    }

    const allV = vals.flat();
    const mag  = Math.max(...allV.map(Math.abs));

    // Kernel block container
    const block = document.createElement('div');
    block.className = 'kern-block'+(fi===selFilter?' sel':'')+(isOvr?' modified':'');
    block.dataset.fi = fi;

    const label = document.createElement('div');
    label.className = 'kern-block-label';
    label.textContent = `Filter ${fi}${isOvr?' ✎':''}`;
    block.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'kern-mini';

    for (let r=0;r<3;r++) {
      for (let c=0;c<3;c++) {
        const v = vals[r][c];
        const cell = document.createElement('div');
        cell.className = 'kern-cell';
        cell.style.background = kColLight(v, mag);
        cell.contentEditable = 'true';
        cell.spellcheck = false;
        cell.textContent = v.toFixed(2);
        cell.dataset.fi = fi;
        cell.dataset.r  = r;
        cell.dataset.c  = c;

        const capturedFi = fi;
        const capturedV  = v;

        cell.addEventListener('focus', function() {
          // Select this filter
          if (selFilter !== capturedFi) {
            selFilter = capturedFi;
            document.querySelectorAll('.kern-block').forEach((b,i) => {
              b.classList.toggle('sel', i===capturedFi);
            });
            updateTopPanels();
          }
          setTimeout(()=>{
            const range=document.createRange();
            range.selectNodeContents(this);
            const sel=window.getSelection();
            sel.removeAllRanges(); sel.addRange(range);
          }, 0);
        });

        cell.addEventListener('keydown', function(e) {
          if (e.key==='Enter')  { e.preventDefault(); this.blur(); }
          if (e.key==='Escape') { this.textContent = capturedV.toFixed(2); this.blur(); }
        });

        cell.addEventListener('blur', function() {
          const raw = this.textContent.trim().replace('−','-').replace(',','.');
          const newVal = parseFloat(raw);
          if (isNaN(newVal)) { this.textContent = capturedV.toFixed(2); return; }
          // compare at 2dp to avoid spurious edits from float rounding
          if (newVal.toFixed(2) === capturedV.toFixed(2)) return;
          onKernelEdit(capturedFi, parseInt(this.dataset.r), parseInt(this.dataset.c), newVal);
        });

        grid.appendChild(cell);
      }
    }

    block.appendChild(grid);

    // Clicking anywhere on the block (except inside a cell) selects this filter
    block.addEventListener('mousedown', e => {
      if (e.target.classList.contains('kern-cell')) return;
      e.preventDefault();
      selFilter = fi;
      document.querySelectorAll('.kern-block').forEach((b,i) => {
        b.classList.toggle('sel', i===fi);
      });
      updateTopPanels();
    });

    container.appendChild(block);
  }
}

function onKernelEdit(fi, r, c, val) {
  if (!kernelOverrides[selLayer][fi]) {
    kernelOverrides[selLayer][fi] = getKernelValsFor(selLayer, fi).map(row=>[...row]);
  }
  kernelOverrides[selLayer][fi][r][c] = val;
  renderAllKernels();
  run();
}

function resetKernel() {
  kernelOverrides[selLayer][selFilter] = null;
  renderAllKernels();
  run();
}

function resetAllKernels() {
  kernelOverrides = Array.from({length:4},()=>Array.from({length:10},()=>null));
  renderAllKernels();
  run();
}

function updateTopPanels() {
  convLayers.forEach((_,li)=>{
    if(!expanded[li]||!fmCache[li]) return;
    const data=fmCache[li];
    const f=Math.min(selFilter,data[0][0].length-1);
    paintToCanvas(document.getElementById(`efc${li}`),data,data.length,data[0].length,f);
    document.getElementById(`efcinf${li}`).textContent=`Filter ${f}`;
  });
}

// Build modified kernel tensor for layer li (caller disposes returned tensor)
function buildModifiedKernel(li, origKernel) {
  if (!kernelOverrides[li].some(o=>o!==null)) return null;
  const arr = origKernel.arraySync(); // [3,3,inC,outC]
  const inC = arr[0][0].length;
  for (let fi=0;fi<10;fi++) {
    const ov = kernelOverrides[li][fi];
    if (!ov) continue;
    for (let y=0;y<3;y++) for (let x=0;x<3;x++)
      for (let c=0;c<inC;c++) arr[y][x][c][fi] = ov[y][x];
  }
  return tf.tensor4d(arr);
}

// ── Image loading ─────────────────────────────────────────────────────────────
async function loadImg(idx) {
  document.querySelectorAll('.img-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.getElementById('uploadName').textContent='No file…';
  await loadURL(IMG_BASE+IMAGES[idx].file, false);
}

async function loadURL(src, revoke) {
  await new Promise((res,rej)=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      const c=document.getElementById('inputCanvas');
      c.getContext('2d').drawImage(img,0,0,64,64);
      if(imgTensor) imgTensor.dispose();
      imgTensor=tf.tidy(()=>tf.browser.fromPixels(c).toFloat().div(255).expandDims(0));
      if(revoke) URL.revokeObjectURL(src);
      res();
    };
    img.onerror=rej;
    img.src=src;
  });
}

// ── Run ───────────────────────────────────────────────────────────────────────
async function run() {
  if (!imgTensor||!model) return;
  const finalX = await runCustomForward();
  if (finalX) { await runCustomPrediction(finalX); finalX.dispose(); }
}

async function runCustomForward() {
  if (!imgTensor) return null;
  fmCache=[];
  let x=imgTensor, owned=false;

  for (let li=0;li<convLayers.length;li++) {
    const {stride,padding,poolAfter}=layerParams[li];
    const wts=convLayers[li].getWeights();
    const origKernel=wts[0], bias=wts.length>1?wts[1]:null;
    const modKernel=buildModifiedKernel(li,origKernel);
    const useKernel=modKernel||origKernel;

    const newX=tf.tidy(()=>{
      let out=tf.conv2d(x,useKernel,[stride,stride],padding);
      if(bias) out=tf.add(out,bias);
      return tf.relu(out);
    });
    if(modKernel) modKernel.dispose();
    if(owned) x.dispose();
    x=newX; owned=true;

    const data=(await x.array())[0];
    fmCache.push(data);
    const H=data.length,W=data[0].length,C=data[0][0].length;
    document.getElementById(`pinf${li}`).textContent=`${H}×${W} · ${C} ch`;
    paintAvgToCanvas(document.getElementById(`pc${li}`),data,H,W,C);
    if(expanded[li]){
      const f=Math.min(selFilter,C-1);
      paintToCanvas(document.getElementById(`efc${li}`),data,H,W,f);
      document.getElementById(`efcinf${li}`).textContent=`Filter ${f}`;
    }
    if(poolAfter){
      const pooled=tf.maxPool(x,[2,2],[2,2],'valid');
      x.dispose(); x=pooled;
    }
  }

  updateLayerCfg();
  renderAllKernels();
  return x;
}

async function runCustomPrediction(x) {
  if(!flattenLayer||!denseLayer) return;
  const bars=document.getElementById('predBars');
  try {
    const flat=flattenLayer.apply(x);
    const pred=denseLayer.apply(flat);
    const probs=(await pred.array())[0];
    flat.dispose(); pred.dispose();
    const order=[...Array(10).keys()].sort((a,b)=>probs[b]-probs[a]);
    bars.innerHTML='';
    order.forEach((cls,rank)=>{
      const pct=(probs[cls]*100).toFixed(1);
      const row=document.createElement('div');
      row.className='pred-row';
      row.innerHTML=`<span class="pred-name">${CLASS_NAMES[cls]}</span>`
        +`<div class="pred-bar-bg"><div class="pred-bar-fill${rank===0?' top':''}" style="width:${Math.min(100,probs[cls]*100)}%"></div></div>`
        +`<span class="pred-pct">${pct}%</span>`;
      bars.appendChild(row);
    });
  } catch(_) {
    const actual=x.shape.slice(1).reduce((a,b)=>a*b,1);
    bars.innerHTML=`<div style="font-size:10px;color:#b45309;background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:10px;line-height:1.7">
      ⚠ <strong>Architecture mismatch</strong><br>
      Classifier expects <strong>1,690</strong> inputs<br>
      (13×13×10 with default params)<br>
      Current output: <strong>${actual}</strong><br>
      <span style="color:#92400e">Reset stride &amp; padding to defaults.</span>
    </div>`;
  }
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function paintAvgToCanvas(canvas, data, H, W, C) {
  if(!canvas) return;
  let mn=1e9,mx=-1e9;
  const avg=[];
  for(let y=0;y<H;y++){
    avg.push([]);
    for(let x=0;x<W;x++){
      let s=0;
      for(let c=0;c<C;c++) s+=data[y][x][c];
      const v=s/C;
      if(v<mn)mn=v; if(v>mx)mx=v;
      avg[y].push(v);
    }
  }
  const tmp=document.createElement('canvas');
  tmp.width=W;tmp.height=H;
  const tctx=tmp.getContext('2d');
  const id=tctx.createImageData(W,H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const pi=(y*W+x)*4, v=nrm(avg[y][x],mn,mx);
    id.data[pi]=id.data[pi+1]=id.data[pi+2]=v; id.data[pi+3]=255;
  }
  tctx.putImageData(id,0,0);
  canvas.getContext('2d').drawImage(tmp,0,0,canvas.width,canvas.height);
}

function paintToCanvas(canvas, data, H, W, f) {
  if(!canvas) return;
  let mn=1e9,mx=-1e9;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(data[y][x][f]<mn)mn=data[y][x][f];
    if(data[y][x][f]>mx)mx=data[y][x][f];
  }
  const tmp=document.createElement('canvas');
  tmp.width=W;tmp.height=H;
  const tctx=tmp.getContext('2d');
  const id=tctx.createImageData(W,H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const pi=(y*W+x)*4, v=nrm(data[y][x][f],mn,mx);
    id.data[pi]=id.data[pi+1]=id.data[pi+2]=v; id.data[pi+3]=255;
  }
  tctx.putImageData(id,0,0);
  canvas.getContext('2d').drawImage(tmp,0,0,canvas.width,canvas.height);
}

function nrm(v,mn,mx){
  if(mx===mn) return 128;
  return Math.max(0,Math.min(255,Math.round((v-mn)/(mx-mn)*255)));
}

// Light pastel colors: blue for positive, pink/red for negative, near-white for zero
function kColLight(v, mag) {
  if (mag < 1e-8 || Math.abs(v) < mag * 0.04) return '#f1f5f9';
  const t = v / mag; // -1 to 1
  if (t > 0) {
    const a = 0.18 + t * 0.57;
    return `rgba(59,130,246,${a.toFixed(2)})`;   // blue-500
  } else {
    const a = 0.18 + (-t) * 0.57;
    return `rgba(239,68,68,${a.toFixed(2)})`;    // red-500
  }
}

function setStatus(msg){ document.getElementById('statusBar').textContent=msg; }

init();
</script>
