<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNN Convolution Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #e8ecf0; color: #1e293b; }

    /* ── Header ── */
    .page-title {
      text-align: center;
      padding: 18px 0 10px;
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
    }
    .status-bar {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    /* ── Cards ── */
    .main { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: white; border-radius: 10px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

    /* ── Top section ── */
    .top-section { display: flex; align-items: flex-start; gap: 0; }

    /* Pipeline */
    .pipeline {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: flex-start;
    }
    .pipe-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pipe-label {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .pipe-label.sel {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #2563eb;
    }
    .pipe-canvas {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 5px;
      image-rendering: pixelated;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }
    .pipe-info { font-size: 9px; color: #94a3b8; margin-top: 5px; text-align: center; }

    .pipe-arrow { flex-shrink: 0; padding: 0 4px; padding-top: 32px; color: #cbd5e1; font-size: 18px; }

    .pool-sep {
      flex-shrink: 0;
      width: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 24px;
    }
    .pool-sep-line { width: 1px; height: 16px; background: #e2e8f0; }
    .pool-sep-txt  { font-size: 7.5px; color: #94a3b8; writing-mode: vertical-rl; padding: 3px 0; white-space: nowrap; }
    .pool-sep-line2 { width: 1px; flex: 1; min-height: 16px; background: #e2e8f0; }

    /* Prediction panel */
    .pred-divider { width: 1px; background: #f1f5f9; flex-shrink: 0; margin: 0 14px; align-self: stretch; }
    .pred-panel { width: 185px; flex-shrink: 0; }
    .ctrl-title  { font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 10px; }
    .pred-row    { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
    .pred-name   { font-size: 10px; color: #475569; width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
    .pred-bar-bg { flex: 1; height: 10px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
    .pred-bar-fill { height: 100%; border-radius: 999px; background: #93c5fd; transition: width .3s; }
    .pred-bar-fill.top { background: #2563eb; }
    .pred-pct    { font-size: 9px; color: #64748b; width: 30px; text-align: right; flex-shrink: 0; }

    /* ── Bottom 3-col ── */
    .bottom-row { display: flex; gap: 12px; align-items: flex-start; }
    .ctrl-col { flex: 1; min-width: 0; }

    /* Col 1: Upload + images */
    .upload-row  { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .browse-btn  {
      font-size: 11px; padding: 4px 12px;
      border: 1px solid #e2e8f0; border-radius: 5px;
      background: white; cursor: pointer; color: #475569;
      transition: border-color .1s;
    }
    .browse-btn:hover { border-color: #94a3b8; }
    #uploadInput { display: none; }
    #uploadName  { font-size: 10px; color: #94a3b8; }
    .img-sec-lbl { font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 6px; }
    .img-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
    }
    .img-btn {
      font-size: 9px; padding: 4px 2px;
      border: 1px solid #e2e8f0; border-radius: 4px;
      background: white; cursor: pointer; color: #475569;
      text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: all .1s;
    }
    .img-btn:hover  { border-color: #94a3b8; }
    .img-btn.active { border-color: #3b82f6; color: #2563eb; background: #eff6ff; }

    /* Col 2: Layer config */
    .layer-tabs  { display: flex; gap: 3px; margin-bottom: 12px; }
    .layer-tab {
      font-size: 11px; padding: 4px 11px;
      border: 1px solid #e2e8f0; border-radius: 5px;
      background: white; color: #64748b; cursor: pointer;
      transition: all .1s;
    }
    .layer-tab.active { border-color: #3b82f6; color: #2563eb; background: #eff6ff; font-weight: 600; }
    .cfg-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
    .cfg-k   { color: #64748b; }
    .cfg-v   { color: #1e293b; font-weight: 600; font-family: monospace; }

    /* Col 3: Kernel */
    .k-header    { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .k-title-txt { font-size: 12px; color: #64748b; }
    .fnav        { display: flex; align-items: center; gap: 5px; }
    .fnav-btn {
      width: 22px; height: 22px;
      border: 1px solid #e2e8f0; border-radius: 4px;
      background: white; color: #64748b; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all .1s;
    }
    .fnav-btn:hover { border-color: #94a3b8; }
    #fLabel { font-size: 11px; font-weight: 600; color: #1e293b; min-width: 56px; text-align: center; }
    .k-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-bottom: 10px;
    }
    .k-cell {
      height: 40px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,.3);
    }
    .layer-detail { font-size: 11px; color: #64748b; margin-bottom: 12px; line-height: 1.5; }
    .refresh-btn {
      width: 100%; padding: 7px;
      border: 1px solid #e2e8f0; border-radius: 6px;
      background: white; color: #475569; cursor: pointer; font-size: 12px; font-weight: 600;
      transition: all .12s;
    }
    .refresh-btn:hover { border-color: #3b82f6; color: #2563eb; background: #eff6ff; }

    .dim-txt { font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>

<div class="page-title">CNN Convolution Demo</div>
<div class="status-bar" id="statusBar">Loading model…</div>

<div class="main">

  <!-- Top: pipeline + prediction -->
  <div class="card top-section">
    <div class="pipeline" id="pipeline"></div>
    <div class="pred-divider"></div>
    <div class="pred-panel">
      <div class="ctrl-title">Prediction</div>
      <div id="predBars"><span class="dim-txt">—</span></div>
    </div>
  </div>

  <!-- Bottom: 3 columns -->
  <div class="bottom-row">

    <!-- Upload + example images -->
    <div class="card ctrl-col">
      <div class="ctrl-title">Upload Image</div>
      <div class="upload-row">
        <button class="browse-btn" onclick="document.getElementById('uploadInput').click()">Browse…</button>
        <input type="file" id="uploadInput" accept="image/*">
        <span id="uploadName">No file…</span>
      </div>
      <div class="img-sec-lbl">Example Images</div>
      <div class="img-grid" id="imgGrid"></div>
    </div>

    <!-- Layer config -->
    <div class="card ctrl-col">
      <div class="ctrl-title">Edit Layer</div>
      <div class="layer-tabs" id="layerTabs"></div>
      <div id="cfgRows"><span class="dim-txt">—</span></div>
    </div>

    <!-- Kernel display -->
    <div class="card ctrl-col">
      <div class="k-header">
        <div class="k-title-txt" id="kTitle">—</div>
        <div class="fnav">
          <button class="fnav-btn" id="fPrev">‹</button>
          <span id="fLabel">Filter 0</span>
          <button class="fnav-btn" id="fNext">›</button>
        </div>
      </div>
      <div class="k-grid" id="kGrid"></div>
      <div class="layer-detail" id="layerDetail">—</div>
      <button class="refresh-btn" id="refreshBtn">▶ Refresh</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script>
const MODEL_URL   = 'https://poloclub.github.io/cnn-explainer/assets/data/model.json';
const IMG_BASE    = 'https://poloclub.github.io/cnn-explainer/assets/img/';
const CLASS_NAMES = ['lifeboat','ladybug','pizza','bell pepper','school bus',
                     'koala','espresso','red panda','orange','sport car'];
const IMAGES = [
  {label:'Espresso',    file:'espresso_1.jpeg'},
  {label:'Ladybug',     file:'bug_1.jpeg'},
  {label:'Pizza',       file:'pizza_1.jpeg'},
  {label:'Bell Pepper', file:'pepper_1.jpeg'},
  {label:'School Bus',  file:'bus_1.jpeg'},
  {label:'Koala',       file:'koala_1.jpeg'},
  {label:'Lifeboat',    file:'boat_1.jpeg'},
  {label:'Red Panda',   file:'panda_1.jpeg'},
  {label:'Orange',      file:'orange_1.jpeg'},
  {label:'Sport Car',   file:'car_1.jpeg'},
];
const LN = ['Conv 1-1','Conv 1-2','Conv 2-1','Conv 2-2'];

let model      = null;
let intermMdls = [];
let convLayers = [];
let imgTensor  = null;
let fmCache    = [];   // [li] → [H][W][C]
let selLayer   = 0;
let selFilter  = 0;

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    setStatus('Loading model…');
    model = await tf.loadLayersModel(MODEL_URL);

    const reluOuts = [];
    for (let i = 1; i < model.layers.length; i++) {
      const l = model.layers[i], p = model.layers[i - 1];
      if (l.getClassName() === 'Activation' && p.getClassName() === 'Conv2D') {
        reluOuts.push(l.output);
        convLayers.push(p);
      }
    }
    intermMdls = reluOuts.map(o => tf.model({ inputs: model.inputs, outputs: o }));

    buildPipeline();
    buildLayerTabs();
    buildImgGrid();

    document.getElementById('fPrev').onclick = () => { if (selFilter > 0) { selFilter--; updateKernel(); updateTopPanels(); } };
    document.getElementById('fNext').onclick = () => { if (selFilter < 9) { selFilter++; updateKernel(); updateTopPanels(); } };
    document.getElementById('refreshBtn').onclick = runPredict;
    document.getElementById('uploadInput').addEventListener('change', async e => {
      const f = e.target.files[0];
      if (!f) return;
      document.getElementById('uploadName').textContent = f.name.slice(0, 16);
      document.querySelectorAll('.img-btn').forEach(b => b.classList.remove('active'));
      const url = URL.createObjectURL(f);
      await loadURL(url, true);
      await runPredict();
    });

    selectLayer(0);
    await loadImg(0);
    await runPredict();
    setStatus('Tiny VGG · 4 conv layers · 10 filters each · 10 classes · click an image to run');
  } catch (e) {
    setStatus('Error: ' + e.message);
    console.error(e);
  }
}

// ── Build pipeline ─────────────────────────────────────────────────────────────
function buildPipeline() {
  const pl = document.getElementById('pipeline');
  pl.innerHTML = '';

  // Input column
  const ic = mkCol(null);
  ic.querySelector('.pipe-label').textContent = 'Input';
  const cv = ic.querySelector('canvas');
  cv.id = 'inputCanvas'; cv.width = 64; cv.height = 64;
  ic.querySelector('.pipe-info').textContent = '64×64 · 3 ch';
  pl.appendChild(ic);

  convLayers.forEach((_, li) => {
    pl.appendChild(mkArrow());

    if (li === 2) {
      const sep = document.createElement('div');
      sep.className = 'pool-sep';
      const l1 = document.createElement('div'); l1.className = 'pool-sep-line';
      const tx = document.createElement('span'); tx.className = 'pool-sep-txt'; tx.textContent = 'MaxPool ÷2';
      const l2 = document.createElement('div'); l2.className = 'pool-sep-line2';
      sep.append(l1, tx, l2);
      pl.appendChild(sep);
    }

    const col = mkCol(li);
    pl.appendChild(col);
  });
}

function mkCol(li) {
  const col = document.createElement('div');
  col.className = 'pipe-col';

  const lbl = document.createElement('div');
  lbl.className = 'pipe-label' + (li !== null && li === selLayer ? ' sel' : '');
  lbl.id = li !== null ? `plbl${li}` : '';
  lbl.textContent = li !== null ? LN[li] : '';
  col.appendChild(lbl);

  const c = document.createElement('canvas');
  c.className = 'pipe-canvas';
  c.id = li !== null ? `pc${li}` : '';
  c.width = 60; c.height = 60;
  col.appendChild(c);

  const inf = document.createElement('div');
  inf.className = 'pipe-info';
  inf.id = li !== null ? `pinf${li}` : '';
  inf.textContent = li !== null ? '—' : '';
  col.appendChild(inf);

  return col;
}

function mkArrow() {
  const d = document.createElement('div');
  d.className = 'pipe-arrow';
  d.textContent = '→';
  return d;
}

// ── Controls ──────────────────────────────────────────────────────────────────
function buildLayerTabs() {
  const tabs = document.getElementById('layerTabs');
  convLayers.forEach((_, li) => {
    const t = document.createElement('button');
    t.className = 'layer-tab' + (li === 0 ? ' active' : '');
    t.textContent = String(li + 1);
    t.title = LN[li];
    t.onclick = () => selectLayer(li);
    tabs.appendChild(t);
  });
}

function buildImgGrid() {
  const grid = document.getElementById('imgGrid');
  IMAGES.forEach((img, i) => {
    const btn = document.createElement('button');
    btn.className = 'img-btn' + (i === 0 ? ' active' : '');
    btn.textContent = img.label;
    btn.onclick = async () => { await loadImg(i); await runPredict(); };
    grid.appendChild(btn);
  });
}

function selectLayer(li) {
  selLayer  = li;
  selFilter = 0;
  document.querySelectorAll('.layer-tab').forEach((t, i) => t.classList.toggle('active', i === li));
  convLayers.forEach((_, i) => {
    const lbl = document.getElementById(`plbl${i}`);
    if (lbl) lbl.className = 'pipe-label' + (i === li ? ' sel' : '');
  });
  updateLayerCfg();
  updateKernel();
}

function updateLayerCfg() {
  const layer  = convLayers[selLayer];
  const cfg    = layer.getConfig();
  const wshp   = layer.getWeights()[0].shape; // [3,3,inC,outC]
  const inC    = wshp[2], outC = wshp[3];
  const ks     = Array.isArray(cfg.kernelSize) ? cfg.kernelSize : [cfg.kernelSize, cfg.kernelSize];
  const stride = Array.isArray(cfg.strides) ? cfg.strides[0] : (cfg.strides || 1);
  const pad    = cfg.padding || 'valid';
  const poolInfo = (selLayer === 1 || selLayer === 3) ? 'MaxPool 2×2 ↓' : 'None';
  const fmInfo = fmCache[selLayer] ? `${fmCache[selLayer].length}×${fmCache[selLayer][0].length}` : '—';

  const rows = [
    ['Channels (in)',    inC],
    ['Channels (out)',   outC],
    ['Layers',          convLayers.length],
    ['Kernel Size',     `${ks[0]} × ${ks[1]}`],
    ['Stride',          stride],
    ['Padding',         pad],
    ['Pooling (after)', poolInfo],
    ['Output size',     fmInfo],
  ];

  document.getElementById('cfgRows').innerHTML = rows.map(([k, v]) =>
    `<div class="cfg-row"><span class="cfg-k">${k}</span><span class="cfg-v">${v}</span></div>`
  ).join('');
}

function updateKernel() {
  const layer  = convLayers[selLayer];
  const arr    = layer.getWeights()[0].arraySync(); // [3,3,inC,outC]
  const inC    = arr[0][0].length;
  const f      = selFilter;

  document.getElementById('fLabel').textContent = `Filter ${f}`;
  document.getElementById('kTitle').textContent = `${LN[selLayer]}`;

  // Best-magnitude input channel for grayscale display
  let bestC = 0, bestM = 0;
  for (let c = 0; c < inC; c++) {
    let m = 0;
    for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++)
      m = Math.max(m, Math.abs(arr[y][x][c][f]));
    if (m > bestM) { bestM = m; bestC = c; }
  }

  const vals = [];
  for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++)
    vals.push(arr[y][x][bestC][f]);
  const mn  = Math.min(...vals), mx = Math.max(...vals);
  const mag = Math.max(Math.abs(mn), Math.abs(mx));

  const grid = document.getElementById('kGrid');
  grid.innerHTML = '';
  vals.forEach(v => {
    const c = document.createElement('div');
    c.className = 'k-cell';
    c.style.background = kCol(v, mag);
    c.textContent = fmtW(v);
    grid.appendChild(c);
  });

  const cfg    = layer.getConfig();
  const stride = Array.isArray(cfg.strides) ? cfg.strides[0] : (cfg.strides || 1);
  const inDim  = fmCache[selLayer] ? `${fmCache[selLayer].length}×${fmCache[selLayer][0].length}` : '—';
  document.getElementById('layerDetail').textContent =
    `${LN[selLayer]} · ${inC} in-ch · 3×3 · stride=${stride} · ${cfg.padding || 'valid'} · ${(selLayer===1||selLayer===3)?'MaxPool 2×2':'no pool'}  ·  output ${inDim}`;
}

function updateTopPanels() {
  convLayers.forEach((_, li) => {
    const data = fmCache[li];
    if (!data) return;
    const H = data.length, W = data[0].length, C = data[0][0].length;
    const f = Math.min(selFilter, C - 1);
    paintToCanvas(document.getElementById(`pc${li}`), data, H, W, f);
  });
}

// ── Image loading ─────────────────────────────────────────────────────────────
async function loadImg(idx) {
  document.querySelectorAll('.img-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.getElementById('uploadName').textContent = 'No file…';
  await loadURL(IMG_BASE + IMAGES[idx].file, false);
}

async function loadURL(src, revoke) {
  await new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.getElementById('inputCanvas');
      c.getContext('2d').drawImage(img, 0, 0, 64, 64);
      if (imgTensor) imgTensor.dispose();
      imgTensor = tf.tidy(() =>
        tf.browser.fromPixels(c).toFloat().div(255).expandDims(0)
      );
      if (revoke) URL.revokeObjectURL(src);
      res();
    };
    img.onerror = rej;
    img.src = src;
  });
}

// ── Inference ─────────────────────────────────────────────────────────────────
async function runPredict() {
  if (!imgTensor || !model) return;
  fmCache = [];

  for (let li = 0; li < intermMdls.length; li++) {
    const out  = intermMdls[li].predict(imgTensor);
    const data = (await out.array())[0]; // [H,W,C]
    out.dispose();
    fmCache.push(data);

    const H = data.length, W = data[0].length, C = data[0][0].length;
    document.getElementById(`pinf${li}`).textContent = `${H}×${W} · ${C} ch`;

    const f = Math.min(selFilter, C - 1);
    paintToCanvas(document.getElementById(`pc${li}`), data, H, W, f);
  }

  const pred  = model.predict(imgTensor);
  const probs = (await pred.array())[0];
  pred.dispose();

  const order = [...Array(10).keys()].sort((a, b) => probs[b] - probs[a]);
  const bars  = document.getElementById('predBars');
  bars.innerHTML = '';
  order.forEach((cls, rank) => {
    const pct = (probs[cls] * 100).toFixed(1);
    const row = document.createElement('div');
    row.className = 'pred-row';
    row.innerHTML =
      `<span class="pred-name">${CLASS_NAMES[cls]}</span>` +
      `<div class="pred-bar-bg"><div class="pred-bar-fill${rank === 0 ? ' top' : ''}" style="width:${Math.min(100, probs[cls] * 100)}%"></div></div>` +
      `<span class="pred-pct">${pct}%</span>`;
    bars.appendChild(row);
  });

  updateLayerCfg();
  updateKernel();
}

// ── Draw feature map for one filter to canvas ─────────────────────────────────
function paintToCanvas(canvas, data, H, W, f) {
  let mn = 1e9, mx = -1e9;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (data[y][x][f] < mn) mn = data[y][x][f];
    if (data[y][x][f] > mx) mx = data[y][x][f];
  }
  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  const tctx = tmp.getContext('2d');
  const id   = tctx.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const pi = (y * W + x) * 4;
    const v  = nrm(data[y][x][f], mn, mx);
    id.data[pi] = id.data[pi+1] = id.data[pi+2] = v;
    id.data[pi+3] = 255;
  }
  tctx.putImageData(id, 0, 0);
  canvas.getContext('2d').drawImage(tmp, 0, 0, canvas.width, canvas.height);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function nrm(v, mn, mx) {
  if (mx === mn) return 128;
  return Math.max(0, Math.min(255, Math.round((v - mn) / (mx - mn) * 255)));
}

function kCol(v, mag) {
  if (mag < 1e-8) return '#e2e8f0';
  const t = v / mag; // [-1, 1]
  if (t >= 0) {
    const r = Math.round(37  + (1 - t) * 170);  // deep blue → light blue
    const g = Math.round(99  + (1 - t) * 120);
    const b = Math.round(235);
    return `rgb(${r},${g},${b})`;
  } else {
    const a = -t;
    const r = Math.round(235);
    const g = Math.round(80  + (1 - a) * 130);  // deep orange → light orange
    const b = Math.round(50  + (1 - a) * 150);
    return `rgb(${r},${g},${b})`;
  }
}

function fmtW(v) {
  const a = Math.abs(v);
  if (a < 1e-4) return '0';
  if (a < 0.01) return v.toExponential(1);
  return v.toFixed(2);
}

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt) e.textContent = txt;
  return e;
}

function setStatus(msg) { document.getElementById('statusBar').textContent = msg; }

init();
</script>
</body>
</html>
