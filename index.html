<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNN Convolution Demo</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 24px; background: #f5f6f8; color: #222; }
    h1 { margin-top: 0; font-size: 28px; text-align: center; }
    h2 { font-size: 17px; margin: 0 0 14px; color: #111; }
    .container { display: flex; flex-direction: column; gap: 16px; max-width: 1100px; margin: 0 auto; }
    .panel { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }

    /* ── Top control bar ─────────────────────────────────────────────────── */
    .top-bar { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 18px; flex-wrap: wrap; }
    .preset-label { font-size: 12px; font-weight: 700; color: #555; margin-bottom: 6px; }
    .preset-strip { display: flex; gap: 8px; }
    .preset-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
    .preset-thumb {
      width: 56px; height: 56px; object-fit: cover; border-radius: 8px;
      border: 2px solid #e5e7eb; transition: border-color 0.15s; display: block; background: #f3f4f6;
    }
    .preset-thumb:hover { border-color: #93c5fd; }
    .preset-thumb.active { border-color: #1d4ed8; box-shadow: 0 0 0 2px #bfdbfe; }
    .preset-caption { font-size: 10px; font-weight: 600; color: #555; }
    .controls-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .play-btn {
      padding: 9px 22px; border-radius: 8px; background: #1d4ed8; color: white;
      font-weight: 700; font-size: 14px; border: none; cursor: pointer;
    }
    .play-btn:hover { background: #1e40af; }
    .speed-row { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
    .filter-select { padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; background: white; }

    /* ── Animation area ──────────────────────────────────────────────────── */
    .main-area { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .anim-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .anim-col-label { font-size: 12px; font-weight: 700; color: #555; }
    .anim-canvas { border-radius: 8px; border: 2px solid #e5e7eb; display: block; }
    .anim-arrow { font-size: 22px; color: #d1d5db; align-self: center; padding-top: 18px; }

    /* ── Kernel display ───────────────────────────────────────────────────── */
    .kernel-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .kernel-col-label { font-size: 12px; font-weight: 700; color: #555; }
    .kernel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .kernel-cell {
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      font-family: Consolas, monospace; font-size: 10px; font-weight: 700;
      border-radius: 4px; border: 1px solid #e5e7eb;
    }
    .kp { background: #dbeafe; color: #1d4ed8; }
    .kn { background: #fee2e2; color: #991b1b; }
    .kz { background: #f3f4f6; color: #9ca3af; }
    .kernel-note { font-size: 10px; color: #9ca3af; text-align: center; max-width: 116px; line-height: 1.4; }

    /* ── Classification ───────────────────────────────────────────────────── */
    .class-col { flex: 1; min-width: 190px; }
    .class-col-label { font-size: 12px; font-weight: 700; color: #555; margin-bottom: 8px; }
    .class-waiting { color: #9ca3af; font-size: 13px; }
    .class-row { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
    .class-label {
      font-size: 13px; font-weight: 600; width: 130px; flex-shrink: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #222;
    }
    .class-bar-bg { flex: 1; background: #f3f4f6; border-radius: 4px; height: 15px; overflow: hidden; }
    .class-bar { height: 15px; border-radius: 4px; background: #1d4ed8; }
    .class-pct { font-size: 13px; font-weight: 700; min-width: 38px; text-align: right; color: #374151; }
    .model-note { font-size: 11px; color: #9ca3af; margin-top: 8px; }

    /* ── Architecture panel ───────────────────────────────────────────────── */
    .arch-canvas-wrap { overflow-x: auto; }
    .arch-canvas-wrap canvas { display: block; }
    .arch-legend { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; }
    .legend-swatch { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>CNN Convolution Demo</h1>

  <div class="container">
    <!-- ── Upper panel ─────────────────────────────────────────────────── -->
    <div class="panel">
      <div class="top-bar">
        <div>
          <div class="preset-label">Choose an Image</div>
          <div class="preset-strip" id="presetStrip"></div>
        </div>
        <div class="controls-row">
          <button class="play-btn" id="playBtn" onclick="animToggle()">▶ Play</button>
          <div class="speed-row">
            Speed
            <input type="range" id="animSpeed" min="1" max="30" value="6" style="width:80px">
          </div>
          <select class="filter-select" id="filterSelect" onchange="onFilterChange()">
            <option value="0">Filter #1</option>
          </select>
        </div>
      </div>

      <div class="main-area">
        <div class="anim-col">
          <div class="anim-col-label">Input + Kernel</div>
          <canvas id="inputCanvas" class="anim-canvas" width="220" height="220"></canvas>
        </div>
        <div class="anim-arrow">→</div>
        <div class="kernel-col">
          <div class="kernel-col-label">Kernel Weights</div>
          <div class="kernel-grid" id="kernelGrid"></div>
          <div class="kernel-note" id="kernelNote">Loading model weights…</div>
        </div>
        <div class="anim-arrow">→</div>
        <div class="anim-col">
          <div class="anim-col-label">Feature Map</div>
          <canvas id="outputCanvas" class="anim-canvas" width="220" height="220"></canvas>
        </div>
        <div class="anim-arrow">→</div>
        <div class="class-col">
          <div class="class-col-label">Classification (MobileNet)</div>
          <div id="classResult"><div class="class-waiting">Select an image and press ▶ Play</div></div>
          <div class="model-note" id="modelStatus">Loading MobileNet…</div>
        </div>
      </div>
    </div>

    <!-- ── Lower panel: Architecture ───────────────────────────────────── -->
    <div class="panel">
      <h2>MobileNet V2 — Model Architecture</h2>
      <div class="arch-canvas-wrap">
        <canvas id="archCanvas" width="900" height="230"></canvas>
      </div>
      <div class="arch-legend">
        <div class="legend-item"><div class="legend-swatch" style="background:#d4d8e0"></div>Convolution</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#c8e6c9"></div>Pooling</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#bbdefb"></div>Fully Connected</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#f3e8ff"></div>Softmax Output</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
  <script>
    // ── Constants ─────────────────────────────────────────────────────────────
    const ANIM_SIZE = 64;
    const DISP_SIZE = 220;
    const MAX_IMG   = 320;

    const PRESETS = [
      { label: 'Dog',    url: 'https://images.unsplash.com/photo-1552053831-71594a27632d?w=320&h=320&fit=crop' },
      { label: 'Cat',    url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Cat03.jpg/480px-Cat03.jpg' },
      { label: 'Bird',   url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Erithacus_rubecula_with_cocked_head.jpg/480px-Erithacus_rubecula_with_cocked_head.jpg' },
      { label: 'Car',    url: 'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=320&h=320&fit=crop' },
      { label: 'Plane',  url: 'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=320&h=320&fit=crop' },
      { label: 'Flower', url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Sunflower_sky_backdrop.jpg/480px-Sunflower_sky_backdrop.jpg' },
    ];

    // ── State ─────────────────────────────────────────────────────────────────
    let animState    = 'idle';
    let animRAF      = null;
    let animPos      = 0;
    let animSmall    = null;
    let animFull     = null;
    let animKernel   = null;
    let animOutW     = 0, animOutH = 0;
    let animOutPx    = null;

    let mobileNetModel = null;
    let allFilters     = null;
    let currentFilter  = 0;

    // ── Utilities ─────────────────────────────────────────────────────────────
    function clamp(x) { return Math.max(0, Math.min(255, Math.round(x))); }

    function scaleImageTo(imageData, tw, th) {
      if (imageData.width === tw && imageData.height === th) return imageData;
      const s = document.createElement('canvas');
      s.width = imageData.width; s.height = imageData.height;
      s.getContext('2d').putImageData(imageData, 0, 0);
      const d = document.createElement('canvas');
      d.width = tw; d.height = th;
      d.getContext('2d').drawImage(s, 0, 0, tw, th);
      return d.getContext('2d').getImageData(0, 0, tw, th);
    }

    // ── Presets ───────────────────────────────────────────────────────────────
    function buildPresets() {
      const strip = document.getElementById('presetStrip');
      PRESETS.forEach((p, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'preset-item';
        const img = document.createElement('img');
        img.className = 'preset-thumb';
        img.crossOrigin = 'anonymous';
        img.src = p.url;
        img.alt = p.label;
        img.title = p.label;
        img.onclick = () => loadPreset(i);
        const cap = document.createElement('div');
        cap.className = 'preset-caption';
        cap.textContent = p.label;
        wrap.appendChild(img); wrap.appendChild(cap);
        strip.appendChild(wrap);
      });
    }

    function loadPreset(idx) {
      document.querySelectorAll('.preset-thumb').forEach((el, i) =>
        el.classList.toggle('active', i === idx));
      if (animState === 'running') cancelAnimationFrame(animRAF);
      animState = 'idle'; animPos = 0;
      document.getElementById('playBtn').textContent = '▶ Play';
      document.getElementById('classResult').innerHTML =
        '<div class="class-waiting">Press ▶ Play to animate & classify</div>';

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const sc = Math.min(MAX_IMG / img.width, MAX_IMG / img.height, 1);
        const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        animFull = c.getContext('2d').getImageData(0, 0, w, h);
        paintStatic(animFull, false);
        clearOutput();
      };
      img.onerror = () => alert('Image failed to load.');
      img.src = PRESETS[idx].url;
    }

    // ── Canvas helpers ────────────────────────────────────────────────────────
    function paintStatic(imageData, pixelated) {
      const ctx = document.getElementById('inputCanvas').getContext('2d');
      const tmp = document.createElement('canvas');
      tmp.width = imageData.width; tmp.height = imageData.height;
      tmp.getContext('2d').putImageData(imageData, 0, 0);
      ctx.imageSmoothingEnabled = !pixelated;
      ctx.clearRect(0, 0, DISP_SIZE, DISP_SIZE);
      ctx.drawImage(tmp, 0, 0, DISP_SIZE, DISP_SIZE);
    }

    function paintWithKernel(ox, oy) {
      paintStatic(animSmall, true);
      if (ox < 0 || !animKernel) return;
      const ctx = document.getElementById('inputCanvas').getContext('2d');
      const sc = DISP_SIZE / ANIM_SIZE, p = 1, ks = animKernel.length;
      const rx = (ox - p) * sc, ry = (oy - p) * sc, rw = ks * sc;
      ctx.fillStyle = 'rgba(255,60,60,0.18)';
      ctx.fillRect(rx, ry, rw, rw);
      ctx.strokeStyle = '#ff3c3c'; ctx.lineWidth = 2;
      ctx.strokeRect(rx+1, ry+1, rw-2, rw-2);
      ctx.fillStyle = 'rgba(255,60,60,0.55)';
      ctx.fillRect(ox*sc, oy*sc, sc, sc);
    }

    function clearOutput() {
      const ctx = document.getElementById('outputCanvas').getContext('2d');
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, DISP_SIZE, DISP_SIZE);
    }

    function paintOutput() {
      const tmp = document.createElement('canvas');
      tmp.width = animOutW; tmp.height = animOutH;
      tmp.getContext('2d').putImageData(
        new ImageData(new Uint8ClampedArray(animOutPx), animOutW, animOutH), 0, 0);
      const ctx = document.getElementById('outputCanvas').getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(tmp, 0, 0, DISP_SIZE, DISP_SIZE);
    }

    // ── Kernel display ────────────────────────────────────────────────────────
    function displayKernel(k) {
      const grid = document.getElementById('kernelGrid');
      grid.innerHTML = '';
      let maxAbs = 0;
      k.forEach(r => r.forEach(v => { if (Math.abs(v) > maxAbs) maxAbs = Math.abs(v); }));
      k.forEach(row => row.forEach(v => {
        const cell = document.createElement('div');
        const n = maxAbs > 0 ? v / maxAbs : 0;
        cell.className = 'kernel-cell ' + (n > 0.08 ? 'kp' : n < -0.08 ? 'kn' : 'kz');
        cell.textContent = v.toFixed(2);
        grid.appendChild(cell);
      }));
      document.getElementById('kernelNote').textContent =
        `Filter #${currentFilter + 1} · Conv Layer 1`;
    }

    // ── Extract MobileNet filters ─────────────────────────────────────────────
    async function extractFilters() {
      try {
        for (const layer of mobileNetModel.model.layers) {
          if (layer.getClassName && layer.getClassName() === 'Conv2D') {
            const w = layer.getWeights();
            if (!w.length) continue;
            const arr = await w[0].array();       // [kH, kW, inC, outC]
            const nF = arr[0][0][0].length;
            allFilters = [];
            for (let f = 0; f < nF; f++)
              allFilters.push(arr.map(row => row.map(cell => cell[0][f])));

            const sel = document.getElementById('filterSelect');
            sel.innerHTML = '';
            for (let i = 0; i < nF; i++) {
              const opt = document.createElement('option');
              opt.value = i; opt.textContent = `Filter #${i + 1}`;
              sel.appendChild(opt);
            }
            displayKernel(allFilters[0]);
            return;
          }
        }
      } catch(e) {
        document.getElementById('kernelNote').textContent = 'Weights unavailable';
      }
    }

    function onFilterChange() {
      currentFilter = Number(document.getElementById('filterSelect').value);
      if (allFilters) displayKernel(allFilters[currentFilter]);
      if (animState !== 'running') { animState = 'idle'; animPos = 0; }
    }

    // ── Animation engine ──────────────────────────────────────────────────────
    function setupAnim() {
      if (!animFull) return false;
      animSmall  = scaleImageTo(animFull, ANIM_SIZE, ANIM_SIZE);
      animKernel = (allFilters && allFilters[currentFilter]) || [[0,1,0],[1,-4,1],[0,1,0]];
      const pad  = 1, ks = 3;
      animOutW   = Math.floor((ANIM_SIZE + 2*pad - ks) / 1 + 1);
      animOutH   = animOutW;
      animOutPx  = new Uint8ClampedArray(animOutW * animOutH * 4);
      for (let i = 3; i < animOutPx.length; i += 4) animOutPx[i] = 255;
      animPos    = 0;
      paintStatic(animSmall, true);
      clearOutput();
      return true;
    }

    function animToggle() {
      if (animState === 'running') {
        cancelAnimationFrame(animRAF);
        animState = 'paused';
        document.getElementById('playBtn').textContent = '▶ Resume';
        return;
      }
      if (!animFull) { alert('Please select an image first'); return; }
      if (animState === 'idle' || animState === 'done') {
        if (!setupAnim()) return;
        document.getElementById('classResult').innerHTML =
          '<div class="class-waiting">Animating…</div>';
      }
      animState = 'running';
      document.getElementById('playBtn').textContent = '⏸ Pause';
      animRAF = requestAnimationFrame(animFrame);
    }

    function animFrame() {
      if (animState !== 'running') return;
      const speed = Number(document.getElementById('animSpeed').value);
      const total = animOutW * animOutH;
      const pad = 1, ks = animKernel.length;

      for (let step = 0; step < speed && animPos < total; step++, animPos++) {
        const ox = animPos % animOutW, oy = Math.floor(animPos / animOutW);
        let sum = 0;
        for (let ky = 0; ky < ks; ky++) for (let kx = 0; kx < ks; kx++) {
          const ix = ox + kx - pad, iy = oy + ky - pad;
          if (ix >= 0 && ix < ANIM_SIZE && iy >= 0 && iy < ANIM_SIZE) {
            const di = (iy * ANIM_SIZE + ix) * 4;
            const g  = (animSmall.data[di] + animSmall.data[di+1] + animSmall.data[di+2]) / 3;
            sum += g * animKernel[ky][kx];
          }
        }
        const v = clamp(Math.abs(sum) * 2.5);
        const b = (oy * animOutW + ox) * 4;
        animOutPx[b] = animOutPx[b+1] = animOutPx[b+2] = v;
      }

      const cx = animPos % animOutW, cy = Math.floor(animPos / animOutW);
      if (animPos < total) paintWithKernel(cx, cy); else paintStatic(animSmall, true);
      paintOutput();

      if (animPos >= total) {
        animState = 'done';
        document.getElementById('playBtn').textContent = '↺ Replay';
        runClassification();
        return;
      }
      animRAF = requestAnimationFrame(animFrame);
    }

    // ── Classification ────────────────────────────────────────────────────────
    async function runClassification() {
      const el = document.getElementById('classResult');
      el.innerHTML = '<div class="class-waiting">Classifying…</div>';
      try {
        const tmp = document.createElement('canvas');
        tmp.width = animFull.width; tmp.height = animFull.height;
        tmp.getContext('2d').putImageData(animFull, 0, 0);
        const preds = await mobileNetModel.classify(tmp, 5);
        const top   = preds[0].probability;
        el.innerHTML = preds.map((p, rank) => {
          const pct  = (p.probability * 100).toFixed(1);
          const barW = Math.round((p.probability / top) * 100);
          const lbl  = p.className.split(',')[0].trim();
          const col  = rank === 0 ? '#1d4ed8' : '#93c5fd';
          return `<div class="class-row">
            <div class="class-label" title="${p.className}">${lbl}</div>
            <div class="class-bar-bg"><div class="class-bar" style="width:${barW}%;background:${col}"></div></div>
            <div class="class-pct">${pct}%</div>
          </div>`;
        }).join('');
        document.getElementById('modelStatus').textContent = '';
      } catch(e) {
        el.innerHTML = `<div class="class-waiting">Failed: ${e.message}</div>`;
      }
    }

    // ── Architecture diagram ──────────────────────────────────────────────────
    function hexShade(hex, pct) {
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      const f = 1 + pct;
      return `rgb(${clamp(r*f)},${clamp(g*f)},${clamp(b*f)})`;
    }

    function drawBlock3D(ctx, fx, fy, fw, fh, depth, color, poolColor, label, sub) {
      const dx = depth * 0.6, dy = depth * 0.3;

      // Right face
      ctx.fillStyle = hexShade(color, -0.18);
      ctx.beginPath();
      ctx.moveTo(fx+fw, fy); ctx.lineTo(fx+fw+dx, fy-dy);
      ctx.lineTo(fx+fw+dx, fy+fh-dy); ctx.lineTo(fx+fw, fy+fh);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#bbb'; ctx.lineWidth = 0.7; ctx.stroke();

      // Top face
      ctx.fillStyle = hexShade(color, 0.14);
      ctx.beginPath();
      ctx.moveTo(fx, fy); ctx.lineTo(fx+dx, fy-dy);
      ctx.lineTo(fx+fw+dx, fy-dy); ctx.lineTo(fx+fw, fy);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // Front face
      if (poolColor) {
        const ph = Math.min(fh * 0.32, 28);
        ctx.fillStyle = color;
        ctx.fillRect(fx, fy, fw, fh - ph);
        ctx.fillStyle = poolColor;
        ctx.fillRect(fx, fy + fh - ph, fw, ph);
      } else {
        ctx.fillStyle = color;
        ctx.fillRect(fx, fy, fw, fh);
      }
      ctx.strokeRect(fx, fy, fw, fh);

      // Label
      const cx = fx + fw / 2 + dx / 2;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#333'; ctx.font = 'bold 11px Arial';
      ctx.fillText(label, cx, fy + fh + 16);
      if (sub) {
        ctx.fillStyle = '#777'; ctx.font = '10px Arial';
        ctx.fillText(sub, cx, fy + fh + 28);
      }
    }

    function drawArch3D(ctx, x1, x2, y) {
      ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2-8, y); ctx.stroke();
      ctx.fillStyle = '#bbb';
      ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(x2-8, y-4); ctx.lineTo(x2-8, y+4); ctx.closePath(); ctx.fill();
    }

    function drawArchitecture() {
      const canvas = document.getElementById('archCanvas');
      const ctx    = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const baseY = 188;
      const CONV  = '#d4d8e0';
      const POOL  = '#c8e6c9';
      const FC    = '#bbdefb';
      const OUT   = '#f3e8ff';

      // [fx, fw, fh, depth, poolColor, label, sub]
      const blocks = [
        [22,  18, 155, 12,  null, 'Input',          '224×224×3'],
        [95,  24, 120, 40,  POOL, 'Conv + Pool',    '3×3, 32ch → 56²'],
        [215, 28,  90, 60,  POOL, 'Conv + Pool',    '3×3, 64ch → 28²'],
        [352, 30,  66, 78,  POOL, 'Conv + Pool',    '3×3, 128ch → 14²'],
        [509, 28,  46, 78,  POOL, 'Conv + Pool',    '3×3, 256ch → 7²'],
        [660, 22,  32, 46,  null, 'Dense',          'Flatten → 1024'],
        [774, 20,  22, 32,  null, 'Softmax',        '1000 classes'],
      ];

      // Compute right edges for arrows
      blocks.forEach(([fx, fw, fh, depth, pc, lbl, sub]) => {
        drawBlock3D(ctx, fx, baseY - fh, fw, fh, depth,
          lbl === 'Dense' ? FC : lbl === 'Softmax' ? OUT : CONV,
          pc, lbl, sub);
      });

      // Arrows: from right edge of block[i] to left edge of block[i+1]
      for (let i = 0; i < blocks.length - 1; i++) {
        const [fx, fw, fh, depth] = blocks[i];
        const [fx2] = blocks[i + 1];
        const rightEdge = fx + fw + depth * 0.6 + 4;
        const arrowY    = baseY - Math.min(blocks[i][2], blocks[i+1][2]) / 2;
        drawArch3D(ctx, rightEdge, fx2 - 4, arrowY);
      }

      // "pooling" label on second block (like PPT)
      const [fx2, fw2, fh2, d2] = blocks[1];
      const ph = Math.min(fh2 * 0.32, 28);
      const labelX = fx2 + fw2 / 2 + d2 * 0.3;
      const labelY = baseY - ph / 2;
      ctx.fillStyle = '#4caf50'; ctx.font = 'italic bold 11px Arial'; ctx.textAlign = 'left';
      ctx.fillText('pooling', labelX + fw2/2 + 6, labelY);

      // Small bracket lines for pooling annotation
      ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(labelX + fw2/2 + 4, baseY - ph);
      ctx.lineTo(labelX + fw2/2 + 2, labelY);
      ctx.lineTo(labelX + fw2/2 + 4, baseY);
      ctx.stroke();
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    buildPresets();
    drawArchitecture();

    (async () => {
      try {
        mobileNetModel = await mobilenet.load({ version: 2, alpha: 1.0 });
        await extractFilters();
        const st = document.getElementById('modelStatus');
        if (st) {
          st.textContent = 'MobileNet ready ✓';
          setTimeout(() => { if (st) st.textContent = ''; }, 3000);
        }
      } catch(e) {
        const st = document.getElementById('modelStatus');
        if (st) st.textContent = 'Model failed to load — check network';
      }
    })();
  </script>
</body>
</html>
