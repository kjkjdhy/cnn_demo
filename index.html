<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNN Demo — Tiny VGG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    /* Header */
    .header {
      background: #0f172a;
      color: #f8fafc;
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title { font-size: 14px; font-weight: 700; }
    .header-sub   { font-size: 11px; color: #94a3b8; }
    #statusBadge  {
      margin-left: auto;
      font-size: 11px;
      color: #94a3b8;
      background: #1e293b;
      padding: 3px 10px;
      border-radius: 999px;
    }

    /* App layout */
    .app {
      display: flex;
      gap: 10px;
      padding: 10px;
      align-items: stretch;
      width: 100%;
    }

    /* Cards */
    .card {
      background: white;
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .card-title {
      font-size: 10px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 8px;
    }

    /* Left panel */
    .left-panel {
      width: 160px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #inputCanvas {
      display: block;
      width: 136px;
      height: 136px;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      image-rendering: pixelated;
      background: #e2e8f0;
    }
    .img-picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      margin-top: 2px;
    }
    .img-btn {
      font-size: 9.5px;
      padding: 4px 2px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      color: #475569;
      text-align: center;
      transition: background .1s, border-color .1s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .img-btn:hover  { background: #f8fafc; border-color: #94a3b8; }
    .img-btn.active { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; font-weight: 600; }

    /* Center panel */
    .center-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .layer-row {
      display: flex;
      gap: 8px;
    }
    .layer-group {
      flex: 1;
      min-width: 0;
    }
    .fm-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .fm-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    canvas.kc {
      width: 15px;
      height: 15px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      flex-shrink: 0;
    }
    canvas.fc {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border: 1px solid #f1f5f9;
      border-radius: 2px;
      background: #f8fafc;
    }
    .fm-label {
      font-size: 8px;
      color: #94a3b8;
    }

    /* MaxPool separator */
    .pool-sep {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 2px;
    }
    .pool-sep-line  { flex: 1; height: 1px; background: #e2e8f0; }
    .pool-sep-label { font-size: 10px; color: #94a3b8; white-space: nowrap; }

    /* Right panel */
    .right-panel {
      width: 200px;
      flex-shrink: 0;
    }
    .right-panel .card {
      height: 100%;
    }
    .pred-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 7px;
    }
    .pred-name {
      font-size: 10px;
      color: #475569;
      width: 76px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pred-bar-bg {
      flex: 1;
      height: 12px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
    }
    .pred-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: #93c5fd;
      transition: width .3s ease;
    }
    .pred-bar-fill.top { background: #2563eb; }
    .pred-pct {
      font-size: 10px;
      color: #64748b;
      width: 34px;
      text-align: right;
      flex-shrink: 0;
    }
    .loading-msg { font-size: 11px; color: #94a3b8; text-align: center; padding: 18px 0; }
  </style>
</head>
<body>

<div class="header">
  <span class="header-title">CNN Demo</span>
  <span class="header-sub">Tiny VGG · 4 Conv layers · 10 filters each · 10-class ImageNet</span>
  <span id="statusBadge">Loading model…</span>
</div>

<div class="app">

  <!-- Left: input image + picker -->
  <div class="left-panel">
    <div class="card">
      <div class="card-title">Input (64 × 64)</div>
      <canvas id="inputCanvas" width="64" height="64"></canvas>
    </div>
    <div class="card">
      <div class="card-title">Test Images</div>
      <div class="img-picker" id="imgPicker"></div>
    </div>
  </div>

  <!-- Center: conv layer feature maps -->
  <div class="center-panel" id="centerPanel">
    <div class="loading-msg">Loading model…</div>
  </div>

  <!-- Right: prediction bars -->
  <div class="right-panel">
    <div class="card">
      <div class="card-title">Prediction</div>
      <div id="predBars"><div class="loading-msg">—</div></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script>
const MODEL_URL   = 'https://poloclub.github.io/cnn-explainer/assets/data/model.json';
const IMG_BASE    = 'https://poloclub.github.io/cnn-explainer/assets/img/';
const CLASS_NAMES = [
  'lifeboat','ladybug','pizza','bell pepper','school bus',
  'koala','espresso','red panda','orange','sport car'
];
const IMAGES = [
  {label:'Espresso',    file:'espresso_1.jpeg'},
  {label:'Ladybug',     file:'bug_1.jpeg'},
  {label:'Pizza',       file:'pizza_1.jpeg'},
  {label:'Bell Pepper', file:'pepper_1.jpeg'},
  {label:'School Bus',  file:'bus_1.jpeg'},
  {label:'Koala',       file:'koala_1.jpeg'},
  {label:'Lifeboat',    file:'boat_1.jpeg'},
  {label:'Red Panda',   file:'panda_1.jpeg'},
  {label:'Orange',      file:'orange_1.jpeg'},
  {label:'Sport Car',   file:'car_1.jpeg'},
];
const LAYER_DISPLAY = ['Conv 1-1','Conv 1-2','Conv 2-1','Conv 2-2'];

let model      = null;
let intermMdls = [];
let convLayers = [];
let imgTensor  = null;

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    setStatus('Loading model…');
    model = await tf.loadLayersModel(MODEL_URL);

    // Detect Conv2D → Activation (relu) pairs
    const reluOuts = [];
    for (let i = 1; i < model.layers.length; i++) {
      const l = model.layers[i], p = model.layers[i - 1];
      if (l.getClassName() === 'Activation' && p.getClassName() === 'Conv2D') {
        reluOuts.push(l.output);
        convLayers.push(p);
      }
    }
    intermMdls = reluOuts.map(o => tf.model({ inputs: model.inputs, outputs: o }));

    buildCenter();
    drawKernels();
    await loadImg(0);
    await runPredict();
    setStatus('Ready — ' + convLayers.length + ' conv layers · click an image to run');
  } catch (e) {
    setStatus('Error: ' + e.message);
    console.error(e);
  }
}

// ── Build center panel layout ─────────────────────────────────────────────────
function buildCenter() {
  const cp = document.getElementById('centerPanel');
  cp.innerHTML = '';

  const rows = [document.createElement('div'), document.createElement('div')];
  rows.forEach(r => r.className = 'layer-row');

  convLayers.forEach((_, li) => {
    const grp = document.createElement('div');
    grp.className = 'layer-group card';

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = LAYER_DISPLAY[li] || ('Conv ' + (li + 1));
    grp.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'fm-grid';

    for (let f = 0; f < 10; f++) {
      const cell = document.createElement('div');
      cell.className = 'fm-cell';

      const kc = document.createElement('canvas');
      kc.className = 'kc';
      kc.id = `kc${li}_${f}`;
      kc.width = 3; kc.height = 3;
      cell.appendChild(kc);

      const fc = document.createElement('canvas');
      fc.className = 'fc';
      fc.id = `fc${li}_${f}`;
      fc.width = 80; fc.height = 80;
      cell.appendChild(fc);

      const lbl = document.createElement('div');
      lbl.className = 'fm-label';
      lbl.textContent = 'F' + f;
      cell.appendChild(lbl);

      grid.appendChild(cell);
    }

    grp.appendChild(grid);
    rows[li < 2 ? 0 : 1].appendChild(grp);
  });

  const sep = document.createElement('div');
  sep.className = 'pool-sep';
  sep.innerHTML = '<div class="pool-sep-line"></div>'
    + '<span class="pool-sep-label">MaxPool ÷2</span>'
    + '<div class="pool-sep-line"></div>';

  cp.appendChild(rows[0]);
  cp.appendChild(sep);
  cp.appendChild(rows[1]);
}

// ── Draw kernel thumbnails (3×3 → 15px via CSS) ───────────────────────────────
function drawKernels() {
  convLayers.forEach((layer, li) => {
    const wt  = layer.getWeights()[0]; // [3,3,inC,outC]
    const arr = wt.arraySync();
    const inC = arr[0][0].length;
    const isRGB = (li === 0 && inC === 3);

    for (let f = 0; f < 10; f++) {
      const kc  = document.getElementById(`kc${li}_${f}`);
      const ctx = kc.getContext('2d');
      const id  = ctx.createImageData(3, 3);

      if (isRGB) {
        // First layer: show as RGB color
        const mm = [0, 1, 2].map(c => {
          let mn = 1e9, mx = -1e9;
          for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
            mn = Math.min(mn, arr[y][x][c][f]);
            mx = Math.max(mx, arr[y][x][c][f]);
          }
          return { mn, mx };
        });
        for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
          const pi = (y * 3 + x) * 4;
          id.data[pi]     = nrm(arr[y][x][0][f], mm[0].mn, mm[0].mx);
          id.data[pi + 1] = nrm(arr[y][x][1][f], mm[1].mn, mm[1].mx);
          id.data[pi + 2] = nrm(arr[y][x][2][f], mm[2].mn, mm[2].mx);
          id.data[pi + 3] = 255;
        }
      } else {
        // Deeper layers: pick highest-magnitude input channel → grayscale
        let bestC = 0, bestM = 0;
        for (let c = 0; c < inC; c++) {
          let m = 0;
          for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++)
            m = Math.max(m, Math.abs(arr[y][x][c][f]));
          if (m > bestM) { bestM = m; bestC = c; }
        }
        let mn = 1e9, mx = -1e9;
        for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
          mn = Math.min(mn, arr[y][x][bestC][f]);
          mx = Math.max(mx, arr[y][x][bestC][f]);
        }
        for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
          const pi = (y * 3 + x) * 4;
          const v  = nrm(arr[y][x][bestC][f], mn, mx);
          id.data[pi] = id.data[pi + 1] = id.data[pi + 2] = v;
          id.data[pi + 3] = 255;
        }
      }
      ctx.putImageData(id, 0, 0);
    }
  });
}

// ── Load a test image ─────────────────────────────────────────────────────────
async function loadImg(idx) {
  document.querySelectorAll('.img-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  const url = IMG_BASE + IMAGES[idx].file;
  await new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.getElementById('inputCanvas');
      c.getContext('2d').drawImage(img, 0, 0, 64, 64);
      if (imgTensor) imgTensor.dispose();
      imgTensor = tf.tidy(() =>
        tf.browser.fromPixels(c).toFloat().div(255).expandDims(0)
      );
      res();
    };
    img.onerror = rej;
    img.src = url;
  });
}

// ── Run inference and draw feature maps ───────────────────────────────────────
async function runPredict() {
  if (!imgTensor || !model) return;

  for (let li = 0; li < intermMdls.length; li++) {
    const out  = intermMdls[li].predict(imgTensor); // [1,H,W,10]
    const data = (await out.array())[0];            // [H,W,10]
    out.dispose();
    const H = data.length, W = data[0].length;

    for (let f = 0; f < 10; f++) {
      let mn = 1e9, mx = -1e9;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        if (data[y][x][f] < mn) mn = data[y][x][f];
        if (data[y][x][f] > mx) mx = data[y][x][f];
      }

      const tmp   = document.createElement('canvas');
      tmp.width = W; tmp.height = H;
      const tctx  = tmp.getContext('2d');
      const id    = tctx.createImageData(W, H);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const pi = (y * W + x) * 4;
        const v  = nrm(data[y][x][f], mn, mx);
        id.data[pi] = id.data[pi + 1] = id.data[pi + 2] = v;
        id.data[pi + 3] = 255;
      }
      tctx.putImageData(id, 0, 0);

      const fc = document.getElementById(`fc${li}_${f}`);
      fc.getContext('2d').drawImage(tmp, 0, 0, fc.width, fc.height);
    }
  }

  // Final prediction probabilities
  const pred  = model.predict(imgTensor);
  const probs = (await pred.array())[0];
  pred.dispose();

  const order = [...Array(10).keys()].sort((a, b) => probs[b] - probs[a]);
  const bars  = document.getElementById('predBars');
  bars.innerHTML = '';
  order.forEach((cls, rank) => {
    const pct = (probs[cls] * 100).toFixed(1);
    const row = document.createElement('div');
    row.className = 'pred-row';
    row.innerHTML =
      `<span class="pred-name">${CLASS_NAMES[cls]}</span>` +
      `<div class="pred-bar-bg"><div class="pred-bar-fill${rank === 0 ? ' top' : ''}" style="width:${Math.min(100, probs[cls] * 100)}%"></div></div>` +
      `<span class="pred-pct">${pct}%</span>`;
    bars.appendChild(row);
  });
}

function nrm(v, mn, mx) {
  if (mx === mn) return 128;
  return Math.max(0, Math.min(255, Math.round((v - mn) / (mx - mn) * 255)));
}

function setStatus(msg) { document.getElementById('statusBadge').textContent = msg; }

// ── Build image picker buttons ────────────────────────────────────────────────
IMAGES.forEach((img, i) => {
  const btn = document.createElement('button');
  btn.className = 'img-btn' + (i === 0 ? ' active' : '');
  btn.textContent = img.label;
  btn.onclick = async () => { await loadImg(i); await runPredict(); };
  document.getElementById('imgPicker').appendChild(btn);
});

init();
</script>
</body>
</html>
