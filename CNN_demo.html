<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNN Convolution Demo</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }

    body { margin: 0; padding: 24px; background: #f5f6f8; color: #222; }
    h1 { margin-top: 0; font-size: 28px; }
    .subtitle { color: #555; margin-bottom: 24px; line-height: 1.5; }

    .container { display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }
    .panel { background: white; border-radius: 14px; padding: 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
    .controls { position: sticky; top: 20px; }

    .control-group { margin-bottom: 16px; }
    label { display: block; font-weight: 700; margin-bottom: 6px; }
    select, input[type="file"], button { width: 100%; }
    select, button { padding: 9px; border-radius: 8px; border: 1px solid #ccc; background: white; font-size: 14px; }
    button { cursor: pointer; background: #222; color: white; border: none; font-weight: 700; }
    button:hover { opacity: 0.9; }
    .preset-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .preset-buttons button { background: #3b4252; font-size: 13px; }

    .toggle-row { display: flex; gap: 16px; }
    .toggle-item { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .toggle-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

    /* Grid */
    .layer-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: stretch; }
    .row-label {
      width: 58px; flex-shrink: 0; font-size: 11px; font-weight: 700; color: #666;
      display: flex; align-items: center; justify-content: flex-end; padding-right: 6px;
    }
    .col-label {
      flex: 1; text-align: center; font-size: 11px; font-weight: 700;
      padding: 4px 0; border-radius: 6px; margin-bottom: 2px;
    }
    .ch-h_edge  { background: #dbeafe; color: #1d4ed8; }
    .ch-v_edge  { background: #dcfce7; color: #15803d; }
    .ch-blur    { background: #fef9c3; color: #854d0e; }
    .ch-sharpen { background: #fce7f3; color: #9d174d; }
    .ch-input   { background: #f3f4f6; color: #374151; }

    .canvas-cell { flex: 1; }
    .canvas-cell canvas {
      width: 100%; display: block; background: #111;
      border-radius: 8px; border: 2px solid #e5e7eb;
      image-rendering: pixelated;
    }
    .canvas-cell.ch-h_edge  canvas { border-color: #93c5fd; }
    .canvas-cell.ch-v_edge  canvas { border-color: #86efac; }
    .canvas-cell.ch-blur    canvas { border-color: #fde68a; }
    .canvas-cell.ch-sharpen canvas { border-color: #f9a8d4; }

    .formula {
      margin-top: 16px; background: #101418; color: #e8edf2;
      padding: 14px; border-radius: 10px; font-family: Consolas, monospace;
      line-height: 1.9; font-size: 13px;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
      .controls { position: static; }
    }
  </style>
</head>
<body>
  <h1>CNN Convolution Demo</h1>
  <p class="subtitle">
    Each layer runs Conv → ReLU → MaxPool on the merged output of the previous layer's channels.
    Watch how features evolve from raw edges to higher-level patterns across layers.
  </p>

  <div class="container">
    <div class="panel controls">
      <div class="control-group">
        <label for="imageUpload">Upload Image</label>
        <input id="imageUpload" type="file" accept="image/*" />
      </div>

      <div class="control-group">
        <label>Example Images</label>
        <div class="preset-buttons">
          <button onclick="loadPreset('woman')">Portrait</button>
          <button onclick="loadPreset('tower')">Building</button>
          <button onclick="loadPreset('city')">Street</button>
          <button onclick="loadPreset('forest')">Nature</button>
        </div>
      </div>

      <div class="control-group">
        <label for="numLayers">Number of Layers</label>
        <select id="numLayers">
          <option value="1">1 Layer</option>
          <option value="2" selected>2 Layers</option>
          <option value="3">3 Layers</option>
        </select>
      </div>

      <div class="control-group">
        <label for="kernelSize">Kernel Size</label>
        <select id="kernelSize">
          <option value="3" selected>3 × 3</option>
          <option value="5">5 × 5</option>
          <option value="7">7 × 7</option>
        </select>
      </div>

      <div class="control-group">
        <label for="stride">Stride</label>
        <select id="stride">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="4">4</option>
        </select>
      </div>

      <div class="control-group">
        <label for="paddingMode">Padding</label>
        <select id="paddingMode">
          <option value="same" selected>same: auto p</option>
          <option value="valid">valid: p = 0</option>
          <option value="custom1">custom: p = 1</option>
          <option value="custom2">custom: p = 2</option>
          <option value="custom3">custom: p = 3</option>
          <option value="custom5">custom: p = 5</option>
        </select>
      </div>

      <div class="control-group">
        <label>Operations per Layer</label>
        <div class="toggle-row">
          <label class="toggle-item">
            <input type="checkbox" id="useRelu" checked /> ReLU
          </label>
          <label class="toggle-item">
            <input type="checkbox" id="usePool" checked /> MaxPool 2×2
          </label>
        </div>
      </div>

      <div class="control-group">
        <label for="channelView">Filter</label>
        <select id="channelView">
          <option value="h_edge">Horizontal Edge</option>
          <option value="v_edge">Vertical Edge</option>
          <option value="blur">Blur</option>
          <option value="sharpen">Sharpen</option>
        </select>
      </div>
    </div>

    <div class="panel">
      <div id="layerGrid"></div>
      <div class="formula" id="formulaBox"></div>
    </div>
  </div>

  <script>
    const MAX_SIZE = 320;
    const CHANNELS = ['h_edge', 'v_edge', 'blur', 'sharpen'];
    const CHANNEL_LABELS = { h_edge: 'H-Edge', v_edge: 'V-Edge', blur: 'Blur', sharpen: 'Sharpen' };

    let originalImageData = null;

    // ── Utilities ─────────────────────────────────────────────────────────────

    function clamp(x) { return Math.max(0, Math.min(255, x)); }

    function getPixel(data, width, height, x, y, c) {
      if (x < 0 || x >= width || y < 0 || y >= height) return 0;
      return data[(y * width + x) * 4 + c];
    }

    function toGrayscale(imageData) {
      const result = new ImageData(imageData.width, imageData.height);
      for (let i = 0; i < imageData.data.length; i += 4) {
        const g = Math.round(0.299 * imageData.data[i] + 0.587 * imageData.data[i+1] + 0.114 * imageData.data[i+2]);
        result.data[i] = result.data[i+1] = result.data[i+2] = g;
        result.data[i+3] = 255;
      }
      return result;
    }

    // Pixel-wise average of multiple same-size ImageDatas.
    function avgChannels(maps) {
      const w = maps[0].width, h = maps[0].height;
      const result = new ImageData(w, h);
      for (let i = 0; i < result.data.length; i += 4) {
        for (let c = 0; c < 3; c++) {
          let sum = 0;
          for (const m of maps) sum += m.data[i + c];
          result.data[i + c] = clamp(sum / maps.length);
        }
        result.data[i + 3] = 255;
      }
      return result;
    }

    // ── Kernel building ───────────────────────────────────────────────────────

    function getPadding(mode, k) {
      if (mode === 'valid') return 0;
      if (mode.startsWith('custom')) return Number(mode.replace('custom', ''));
      if (mode === 'same') return Math.floor((k - 1) / 2);
      return 0;
    }

    // Pascal's triangle row of length n, used as the smoothing weights in Sobel-style kernels.
    function binomialRow(n) {
      const row = [1];
      for (let i = 1; i < n; i++) row[i] = row[i-1] * (n - i) / i;
      return row;
    }

    function buildKernel(type, size) {
      const kernel = Array.from({ length: size }, () => Array(size).fill(0));
      const center = Math.floor(size / 2);

      if (type === 'blur') {
        const v = 1 / (size * size);
        for (let y = 0; y < size; y++)
          for (let x = 0; x < size; x++)
            kernel[y][x] = v;
      }

      if (type === 'h_edge' || type === 'v_edge') {
        // Sobel-style: outer product of a binomial smooth vector and a central-difference derivative vector.
        // h_edge differentiates in y (responds to horizontal edges), v_edge differentiates in x.
        const binom = binomialRow(size);
        const deriv = Array.from({ length: size }, (_, i) => i - center);
        for (let y = 0; y < size; y++)
          for (let x = 0; x < size; x++)
            kernel[y][x] = type === 'h_edge' ? deriv[y] * binom[x] : deriv[x] * binom[y];
      }

      if (type === 'sharpen') {
        kernel[center][center] = size * size;
        const v = -1;
        for (let y = 0; y < size; y++)
          for (let x = 0; x < size; x++)
            if (x !== center || y !== center) kernel[y][x] = v;
      }

      return kernel;
    }

    // ── Convolution + layer ops ───────────────────────────────────────────────

    function convolveImageData(imageData, kernel, useAbs = false, stride = 1, padding = 0) {
      const W = imageData.width, H = imageData.height;
      const input = imageData.data;
      const k = kernel.length;
      const outW = Math.max(1, Math.floor((W + 2 * padding - k) / stride + 1));
      const outH = Math.max(1, Math.floor((H + 2 * padding - k) / stride + 1));
      const output = new Uint8ClampedArray(outW * outH * 4);

      for (let oy = 0; oy < outH; oy++) {
        for (let ox = 0; ox < outW; ox++) {
          const base = (oy * outW + ox) * 4;
          for (let c = 0; c < 3; c++) {
            let sum = 0;
            for (let ky = 0; ky < k; ky++)
              for (let kx = 0; kx < k; kx++)
                sum += getPixel(input, W, H, ox * stride + kx - padding, oy * stride + ky - padding, c) * kernel[ky][kx];
            output[base + c] = clamp(useAbs ? Math.abs(sum) : sum);
          }
          output[base + 3] = 255;
        }
      }
      return new ImageData(output, outW, outH);
    }

    // Suppress activations below 30 to create sparsity, mirroring ReLU's effect on signed feature maps.
    function applyReLU(imageData) {
      const result = new ImageData(imageData.width, imageData.height);
      for (let i = 0; i < imageData.data.length; i += 4) {
        for (let c = 0; c < 3; c++)
          result.data[i + c] = imageData.data[i + c] < 30 ? 0 : imageData.data[i + c];
        result.data[i + 3] = 255;
      }
      return result;
    }

    function applyMaxPool(imageData) {
      const W = imageData.width, H = imageData.height;
      const outW = Math.max(1, Math.floor(W / 2));
      const outH = Math.max(1, Math.floor(H / 2));
      const output = new Uint8ClampedArray(outW * outH * 4);

      for (let oy = 0; oy < outH; oy++) {
        for (let ox = 0; ox < outW; ox++) {
          const base = (oy * outW + ox) * 4;
          for (let c = 0; c < 3; c++) {
            let maxVal = 0;
            for (let py = 0; py < 2; py++)
              for (let px = 0; px < 2; px++) {
                const ix = ox * 2 + px, iy = oy * 2 + py;
                if (ix < W && iy < H)
                  maxVal = Math.max(maxVal, imageData.data[(iy * W + ix) * 4 + c]);
              }
            output[base + c] = maxVal;
          }
          output[base + 3] = 255;
        }
      }
      return new ImageData(output, outW, outH);
    }

    // ── Pipeline ──────────────────────────────────────────────────────────────

    function runPipeline() {
      if (!originalImageData) return;

      const numLayers  = Number(document.getElementById('numLayers').value);
      const k          = Number(document.getElementById('kernelSize').value);
      const stride     = Number(document.getElementById('stride').value);
      const paddingMode = document.getElementById('paddingMode').value;
      const padding    = getPadding(paddingMode, k);
      const useRelu    = document.getElementById('useRelu').checked;
      const usePool    = document.getElementById('usePool').checked;

      const gray = toGrayscale(originalImageData);

      // layers[i] maps channel name → ImageData
      // layers[0] is the input layer — same grayscale image for all channel slots
      const layers = [Object.fromEntries(CHANNELS.map(ch => [ch, gray]))];

      for (let l = 1; l <= numLayers; l++) {
        // Each layer's input is the pixel-wise average of all previous layer's channels,
        // simulating how CNN neurons aggregate across all input channels.
        const layerInput = avgChannels(CHANNELS.map(ch => layers[l - 1][ch]));

        const layerOutput = {};
        for (const ch of CHANNELS) {
          const useAbs = ch === 'h_edge' || ch === 'v_edge';
          let fm = convolveImageData(layerInput, buildKernel(ch, k), useAbs, stride, padding);
          if (useRelu) fm = applyReLU(fm);
          if (usePool) fm = applyMaxPool(fm);
          layerOutput[ch] = fm;
        }
        layers.push(layerOutput);
      }

      renderGrid(layers, k, stride, padding, paddingMode, useRelu, usePool);
    }

    // ── Rendering ─────────────────────────────────────────────────────────────

    function renderGrid(layers, k, stride, padding, paddingMode, useRelu, usePool) {
      const channelView = document.getElementById('channelView').value;
      const visChannels = channelView === 'all' ? CHANNELS : [channelView];
      const grid = document.getElementById('layerGrid');
      grid.innerHTML = '';

      // Column header row
      const headerRow = document.createElement('div');
      headerRow.className = 'layer-row';
      headerRow.appendChild(makeEl('div', 'row-label'));
      visChannels.forEach(ch => {
        headerRow.appendChild(makeEl('div', `col-label ch-${ch}`, CHANNEL_LABELS[ch]));
      });
      grid.appendChild(headerRow);

      // Input + layer rows
      const rowLabels = ['Input', ...Array.from({ length: layers.length - 1 }, (_, i) => `Layer ${i + 1}`)];
      layers.forEach((layerMaps, i) => {
        const row = document.createElement('div');
        row.className = 'layer-row';
        row.appendChild(makeEl('div', 'row-label', rowLabels[i]));

        visChannels.forEach(ch => {
          const cell = document.createElement('div');
          cell.className = `canvas-cell ${i === 0 ? 'ch-input' : 'ch-' + ch}`;
          const canvas = document.createElement('canvas');
          const img = layerMaps[ch];
          canvas.width = img.width;
          canvas.height = img.height;
          canvas.getContext('2d').putImageData(img, 0, 0);
          cell.appendChild(canvas);
          row.appendChild(cell);
        });

        grid.appendChild(row);
      });

      // Formula
      const steps = [
        `<b>Per layer</b> (kernel ${k}×${k}, stride=${stride}, padding=${paddingMode} [p=${padding}]):`,
        `  feature_map[ch] = Conv(avg(prev_channels), kernel[ch])`,
      ];
      if (useRelu) steps.push('  → ReLU : x = 0  if  x &lt; 30');
      if (usePool) steps.push('  → MaxPool 2×2  →  spatial size ÷ 2');
      if (layers.length > 2) steps.push('<br><b>Between layers:</b> layer_input = avg(all ch feature maps)');
      document.getElementById('formulaBox').innerHTML = steps.join('<br>');
    }

    function makeEl(tag, cls, text) {
      const el = document.createElement(tag);
      el.className = cls;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    // ── Image loading ─────────────────────────────────────────────────────────

    function loadImageFromImg(img) {
      const scale = Math.min(MAX_SIZE / img.width, MAX_SIZE / img.height, 1);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const temp = document.createElement('canvas');
      temp.width = w; temp.height = h;
      temp.getContext('2d').drawImage(img, 0, 0, w, h);
      originalImageData = temp.getContext('2d').getImageData(0, 0, w, h);
      runPipeline();
    }

    function loadPreset(seed) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => loadImageFromImg(img);
      img.onerror = () => alert('图片加载失败，请检查网络连接');
      img.src = `https://picsum.photos/seed/${seed}/${MAX_SIZE}/${MAX_SIZE}`;
    }

    // ── Event listeners ───────────────────────────────────────────────────────

    document.getElementById('imageUpload').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => loadImageFromImg(img);
        img.onerror = () => alert('图片加载失败，请检查文件格式');
        img.src = e.target.result;
      };
      reader.onerror = () => alert('文件读取失败');
      reader.readAsDataURL(file);
    });

    ['numLayers', 'kernelSize', 'stride', 'paddingMode', 'useRelu', 'usePool', 'channelView'].forEach(id => {
      document.getElementById(id).addEventListener('change', runPipeline);
    });

    loadPreset('woman');
  </script>
</body>
</html>
